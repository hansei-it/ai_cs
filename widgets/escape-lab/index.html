<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글이 HTML로 읽히면</title>
<meta name="description" content="글을 써 넣거나 예를 눌러, innerHTML, textContent, html.escape로 넣었을 때 생기는 요소와 글을 견준다">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2329;
    --muted: #5f6670;
    --line: #d9dde3;
    --soft: #f3f5f8;
    --accent: #3f51b5;
    --accent-bg: #e8ebfa;
    --read: #1971c2;
    --read-bg: #e7f1fb;
    --write: #c2410c;
    --write-bg: #fdf0e3;
    --good: #2b8a3e;
    --good-bg: #e6f4ea;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1e2129;
    --fg: #e2e4e9;
    --muted: #9aa0aa;
    --line: #3a3f4b;
    --soft: #262a33;
    --accent: #8c9eff;
    --accent-bg: #2b3156;
    --read: #74c0fc;
    --read-bg: #1d3247;
    --write: #ffa94d;
    --write-bg: #3d2a17;
    --good: #69db7c;
    --good-bg: #1f3326;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    padding: 14px 16px 16px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    word-break: keep-all;
  }
  .mono { font-family: "JetBrains Mono", Consolas, "D2Coding", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", monospace; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .lead { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 8px; }
  .row > .label { color: var(--muted); font-size: 14px; min-width: 4.5em; }
  .btn {
    font: inherit; font-size: 13px; color: var(--fg); background: var(--soft); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 9px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .btn.go { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=range] { accent-color: var(--accent); }
  .warn { color: var(--write); font-weight: 700; }
  .fine { color: var(--good); font-weight: 700; }
  .note { margin: 10px 0 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--soft); font-size: 14px; min-height: 2.6em; }
  .inp { flex: 1 1 14em; min-width: 0; font-size: 14px; padding: 3px 8px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  .row .btn { font-family: "JetBrains Mono", Consolas, "D2Coding", "Malgun Gothic", monospace; font-size: 12px; }
  .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .cols section { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 13px; min-width: 0; }
  .cols h2 { font-size: 13px; margin: 0 0 4px; color: var(--muted); font-weight: 700; }
  .nodes { margin: 0; padding-left: 18px; }
  .nodes li { overflow-wrap: anywhere; }
  .nodes .el { color: var(--write); font-weight: 700; }
  .nodes .tx { color: var(--fg); }
  .nodes .attr { color: var(--write); }
  .esc { background: var(--soft); border-radius: 4px; padding: 2px 6px; margin-bottom: 4px; overflow-wrap: anywhere; font-size: 12px; }
  @media (max-width: 560px) { .cols { grid-template-columns: 1fr; } }
  @media (max-width: 480px) { body { padding: 10px; font-size: 14px; } }
</style>
</head>
<body>
<h1>글이 HTML로 읽히면</h1>
<p class="lead">손님이 이름 칸에 쓴 글을 페이지에 넣는 세 가지 방법을 견준다. 첫 칸(innerHTML)은 그 글을 HTML로 읽으면 생기는 요소를 보여 준다(실행하지 않는 문서에서 만들어 보기만 한다).</p>
<div class="row">
  <label class="label" for="src">넣을 글</label>
  <input id="src" class="mono inp" value="&lt;b&gt;Tom &amp; Jerry&lt;/b&gt;" spellcheck="false" autocomplete="off">
</div>
<div class="row" role="group" aria-label="예">
  <span class="label">예</span>
  <button class="btn" data-ex="&lt;b&gt;Tom &amp; Jerry&lt;/b&gt;">&lt;b&gt;Tom &amp; Jerry&lt;/b&gt;</button>
  <button class="btn" data-ex="5 &lt; 7 &amp; 8 &gt; 3">5 &lt; 7 &amp; 8 &gt; 3</button>
  <button class="btn" data-ex="O'Brien &quot;Tom&quot;">O'Brien "Tom"</button>
  <button class="btn" data-ex="김하나">김하나</button>
</div>
<div class="cols">
  <section><h2>innerHTML로 넣으면</h2><ul class="nodes" id="asHtml"></ul></section>
  <section><h2>textContent로 넣으면</h2><ul class="nodes" id="asText"></ul></section>
  <section><h2>html.escape로 바꿔 HTML에 넣으면</h2><div class="esc mono" id="escaped"></div><ul class="nodes" id="asEsc"></ul></section>
</div>
<p class="note" id="note" aria-live="polite"></p>

<script>
// ==== 계산 로직 (화면과 분리: tests에서 그대로 불러 검증한다) ====
const EscapeLogic = (() => {
  // Python의 html.escape(s, quote=True)와 같은 바꾸기. &를 먼저 바꿔야 이미 바꾼 글자를 다시 바꾸지 않는다
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#x27;");
  }
  return { escapeHtml };
})();
// ==== 계산 로직 끝 ====

// ---- 강의 사이트 안에 들어갔을 때: 테마와 높이 맞추기 ----
(() => {
  const media = matchMedia("(prefers-color-scheme: dark)");
  let parentBody = null;
  try { if (window.parent !== window) parentBody = window.parent.document.body; } catch { parentBody = null; }
  const sync = () => {
    let dark = media.matches;
    const scheme = parentBody && parentBody.getAttribute("data-md-color-scheme");
    if (scheme) dark = scheme === "slate";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  };
  sync();
  media.addEventListener("change", sync);
  if (parentBody) new MutationObserver(sync).observe(parentBody, { attributes: true, attributeFilter: ["data-md-color-scheme"] });

  // 문서 전체가 아니라 내용(body) 높이로 맞춘다. 그래야 내용이 줄 때 iframe도 줄어든다.
  const fit = () => {
    try {
      if (window.frameElement) window.frameElement.style.height = `${Math.ceil(document.body.getBoundingClientRect().height)}px`;
    } catch { /* 다른 출처에서 열린 경우 */ }
  };
  new ResizeObserver(fit).observe(document.body);
})();

// ---- 화면 ----
(() => {
  const L = EscapeLogic;
  const $ = id => document.getElementById(id);
  const show = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");      // 화면에 글자 그대로 보이게

  // 글을 HTML로 읽었을 때 생기는 마디. 실행하지 않는 문서(DOMParser)에서 만들어 보기만 한다
  function parse(html) {
    const doc = new DOMParser().parseFromString(`<!doctype html><body>${html}`, "text/html");   // 뒤에 </body>를 붙이면 치는 도중의 태그가 그것까지 삼킨다
    const out = [];
    const walk = (node, depth) => {
      for (const n of node.childNodes) {
        if (n.nodeType === 1) {
          const attrs = [...n.attributes].map(a => a.name);
          out.push({ kind: "el", depth, name: n.tagName.toLowerCase(), attrs });
          walk(n, depth + 1);
        } else if (n.nodeType === 3 && n.textContent) out.push({ kind: "tx", depth, text: n.textContent });
      }
    };
    walk(doc.body, 0);
    return out;
  }
  const list = nodes => nodes.length ? nodes.map(n => n.kind === "el"
    ? `<li style="margin-left:${n.depth}em"><span class="el">요소 &lt;${show(n.name)}&gt;</span>${n.attrs.length ? ` <span class="attr">속성 ${n.attrs.map(show).join(", ")}</span>` : ""}</li>`
    : `<li style="margin-left:${n.depth}em"><span class="tx">글 "${show(n.text)}"</span></li>`).join("") : "<li>(아무것도 없다)</li>";

  function render() {
    const s = $("src").value;
    document.querySelectorAll("[data-ex]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.ex === s)));
    const asHtml = parse(s);
    const esc = L.escapeHtml(s);
    $("asHtml").innerHTML = list(asHtml);
    $("asText").innerHTML = s ? `<li><span class="tx">글 "${show(s)}"</span></li>` : "<li>(아무것도 없다)</li>";
    $("escaped").textContent = esc;
    $("escaped").hidden = !s;
    $("asEsc").innerHTML = list(parse(esc));
    const els = asHtml.filter(n => n.kind === "el");
    const onAttr = els.some(n => n.attrs.some(a => a.startsWith("on")));
    const read = asHtml.filter(n => n.kind === "tx").map(n => n.text).join("");   // HTML로 읽었을 때 남는 글
    const note = !s ? "글을 써 넣는다."
      : els.length ? `글이 요소 ${els.length}개(${[...new Set(els.map(n => "<" + n.name + ">"))].join(", ")})가 되었다. 손님이 쓴 글이 HTML로 읽힌 것이다. 화면에서는 textContent로, 서버에서 HTML을 만들 때는 html.escape로 넣으면 글자 그대로 남는다.`
        + (onAttr ? " on으로 시작하는 속성은 브라우저가 코드로 돌린다. XSS의 흔한 길 하나다." : "")
      : read !== s ? "요소는 생기지 않았지만, HTML로 읽히며 글이 바뀌었다(&amp; 같은 문자 참조는 한 글자가 되고, 주석과 끝나지 않은 태그는 사라진다). textContent나 html.escape로 넣으면 쓴 글 그대로 남는다."
      : esc !== s ? "요소는 생기지 않았지만, <, >, &, 따옴표처럼 HTML에서 뜻이 있는 글자가 들어 있다. 넣는 자리에 맞게 이스케이프해 넣는다."
      : "HTML에서 뜻이 있는 글자가 없어 세 방법의 결과가 같다. 그래도 손님이 쓴 글은 늘 같은 방법으로 넣는다.";
    if ($("note").textContent !== note) $("note").textContent = note;   // 바뀔 때만 써서 화면 읽기 프로그램이 같은 말을 되풀이하지 않게
  }
  $("src").addEventListener("input", render);
  document.querySelectorAll("[data-ex]").forEach(b => b.addEventListener("click", () => { $("src").value = b.dataset.ex; render(); }));
  render();
})();
</script>
</body>
</html>
