<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>붙여 넣기 전에 가리기</title>
<meta name="description" content="주문 기록을 AI에게 붙여 넣기 전에 개인정보와 비밀값의 형식을 켜고 끄며 가려 보고, '놓친 것 보기'로 형식으로는 잡히지 않는 것을 확인한다">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2329;
    --muted: #5f6670;
    --line: #d9dde3;
    --soft: #f3f5f8;
    --accent: #3f51b5;
    --accent-bg: #e8ebfa;
    --read: #1971c2;
    --read-bg: #e7f1fb;
    --write: #c2410c;
    --write-bg: #fdf0e3;
    --good: #2b8a3e;
    --good-bg: #e6f4ea;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1e2129;
    --fg: #e2e4e9;
    --muted: #9aa0aa;
    --line: #3a3f4b;
    --soft: #262a33;
    --accent: #8c9eff;
    --accent-bg: #2b3156;
    --read: #74c0fc;
    --read-bg: #1d3247;
    --write: #ffa94d;
    --write-bg: #3d2a17;
    --good: #69db7c;
    --good-bg: #1f3326;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    padding: 14px 16px 16px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    word-break: keep-all;
  }
  .mono { font-family: "JetBrains Mono", Consolas, "D2Coding", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", monospace; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .lead { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 8px; }
  .row > .label { color: var(--muted); font-size: 14px; min-width: 4.5em; }
  .btn {
    font: inherit; font-size: 13px; color: var(--fg); background: var(--soft); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 9px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .btn.go { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=range] { accent-color: var(--accent); }
  .warn { color: var(--write); font-weight: 700; }
  .fine { color: var(--good); font-weight: 700; }
  .note { margin: 10px 0 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--soft); font-size: 14px; min-height: 2.6em; }
  .cap { font-size: 13px; color: var(--muted); margin: 6px 0 3px; }
  .src { width: 100%; font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; resize: vertical; }
  #pats { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .view { margin: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 3em; }
  .view mark { background: var(--good-bg); color: var(--good); border-radius: 3px; padding: 0 1px; font-weight: 700; }
  .view mark.miss { background: var(--write-bg); color: var(--write); outline: 1px dashed var(--write); }
  .view .tag { font-size: 10px; vertical-align: super; color: var(--muted); margin-left: 1px; }
  @media (max-width: 480px) { body { padding: 10px; font-size: 14px; } }
</style>
</head>
<body>
<h1>붙여 넣기 전에 가리기</h1>
<p class="lead">오류를 물으려고 주문 기록을 AI에게 붙여 넣으려 한다. 기록은 이 강의가 만든 가짜 데이터다. 정해진 형식(주민등록번호, 전화번호, 이메일, API 키)을 찾아 가린다. 글을 고쳐 써 볼 수도 있다.</p>
<div class="cap">AI에게 붙여 넣으려는 글(고쳐 써도 된다)</div>
<textarea id="src" class="src mono" rows="5" spellcheck="false" aria-label="붙여 넣으려는 글"></textarea>
<div class="row" role="group" aria-label="가릴 형식">
  <span class="label">가릴 형식</span>
  <span id="pats"></span>
</div>
<div class="row">
  <button class="btn" id="miss">놓친 것 보기</button>
  <button class="btn" id="sample">표본으로 되돌리기</button>
</div>
<div class="cap">원문에서 잡힌 곳</div>
<div class="view mono" id="view"></div>
<div class="cap">가린 뒤 AI에게 가는 글</div>
<pre class="view mono" id="out"></pre>
<p class="note" id="note" aria-live="polite"></p>

<script>
// ==== 계산 로직 (화면과 분리: tests에서 그대로 불러 검증한다) ====
const ScrubLogic = (() => {
  // 99번 본문의 scrub.py와 같은 형식(글자 범위를 ASCII로 정확히 적어 Python과 JavaScript가 같게 동작한다)
  const PATTERNS = [
    ["주민등록번호", "[0-9]{6}-[1-4][0-9]{6}"],
    ["전화번호", "01[016789]-[0-9]{3,4}-[0-9]{4}"],
    ["이메일", "[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+\\.[A-Za-z0-9.-]+"],
    ["API 키", "sk-[A-Za-z0-9]{16,}"],
  ];
  const SAMPLE = "주문 1042 김하나 010-1234-5678 hana@example.com 결제 실패\n"
    + "주문 1043 이두리 010 9876 5432 주민 900101-1234567 재시도\n"
    + "설정 API_KEY=sk-test1234567890abcdef 시간 초과";
  // 표본에서 형식으로는 잡히지 않는 개인정보(사람이 찾아야 한다)
  const MISSED = ["김하나", "이두리", "010 9876 5432"];

  // 켠 형식만으로 가린 글(scrub.py처럼 차례대로 바꾼다)
  function scrub(text, on = PATTERNS.map(() => true)) {
    let out = text;
    PATTERNS.forEach(([name, p], k) => { if (on[k]) out = out.replace(new RegExp(p, "g"), `[${name}]`); });
    return out;
  }
  // 원문에서 형식마다 잡힌 자리: [{ name, start, end }], 앞에서부터.
  // scrub()처럼 형식을 차례대로 적용해, 앞 형식이 잡은 곳은 뒤 형식이 보지 않는다(같은 길이의 빈 글자로 덮어 자리는 그대로 둔다)
  function spans(text, on = PATTERNS.map(() => true)) {
    const out = [];
    let work = text;
    PATTERNS.forEach(([name, p], k) => {
      if (!on[k]) return;
      for (const m of work.matchAll(new RegExp(p, "g"))) out.push({ name, start: m.index, end: m.index + m[0].length });
      work = work.replace(new RegExp(p, "g"), s => "\u0000".repeat(s.length));
    });
    return out.sort((a, b) => a.start - b.start);
  }
  function missed(text) { return MISSED.filter(w => text.includes(w)); }

  return { PATTERNS, SAMPLE, MISSED, scrub, spans, missed };
})();
// ==== 계산 로직 끝 ====

// ---- 강의 사이트 안에 들어갔을 때: 테마와 높이 맞추기 ----
(() => {
  const media = matchMedia("(prefers-color-scheme: dark)");
  let parentBody = null;
  try { if (window.parent !== window) parentBody = window.parent.document.body; } catch { parentBody = null; }
  const sync = () => {
    let dark = media.matches;
    const scheme = parentBody && parentBody.getAttribute("data-md-color-scheme");
    if (scheme) dark = scheme === "slate";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  };
  sync();
  media.addEventListener("change", sync);
  if (parentBody) new MutationObserver(sync).observe(parentBody, { attributes: true, attributeFilter: ["data-md-color-scheme"] });

  // 문서 전체가 아니라 내용(body) 높이로 맞춘다. 그래야 내용이 줄 때 iframe도 줄어든다.
  const fit = () => {
    try {
      if (window.frameElement) window.frameElement.style.height = `${Math.ceil(document.body.getBoundingClientRect().height)}px`;
    } catch { /* 다른 출처에서 열린 경우 */ }
  };
  new ResizeObserver(fit).observe(document.body);
})();

// ---- 화면 ----
(() => {
  const L = ScrubLogic;
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let on = L.PATTERNS.map(() => true), showMiss = false;

  $("pats").innerHTML = L.PATTERNS.map(([name], k) => `<button class="btn" data-k="${k}">${name}</button>`).join("");
  $("src").value = L.SAMPLE;

  function render() {
    const text = $("src").value;
    const sp = L.spans(text, on);
    const miss = showMiss ? L.missed(text) : [];
    // 잡힌 곳(초록)과, 놓친 것 보기를 켰을 때 놓친 곳(주황 점선)을 함께 칠한다
    const marks = sp.map(s => ({ ...s, cls: "" }));
    for (const w of miss) {
      let from = 0, at;
      while ((at = text.indexOf(w, from)) >= 0) {
        if (!marks.some(m => at < m.end && m.start < at + w.length)) marks.push({ start: at, end: at + w.length, cls: "miss", name: "놓침" });
        from = at + w.length;
      }
    }
    marks.sort((a, b) => a.start - b.start);
    let html = "", pos = 0;
    for (const m of marks) {
      html += esc(text.slice(pos, m.start)) + `<mark class="${m.cls}">${esc(text.slice(m.start, m.end))}</mark><span class="tag">${m.name}</span>`;
      pos = m.end;
    }
    $("view").innerHTML = html + esc(text.slice(pos));
    $("out").textContent = L.scrub(text, on);
    document.querySelectorAll("[data-k]").forEach(b => b.setAttribute("aria-pressed", String(on[b.dataset.k])));
    $("miss").setAttribute("aria-pressed", String(showMiss));

    const left = L.missed(L.scrub(text, on));
    const offHits = L.spans(text).filter(s => !on[L.PATTERNS.findIndex(([name]) => name === s.name)]);
    const edited = text !== L.SAMPLE;
    let note;
    if (!text.trim()) note = "붙여 넣을 글이 비었다.";
    else if (offHits.length) note = `꺼 둔 형식(${[...new Set(offHits.map(s => s.name))].join(", ")})에 맞는 것이 ${offHits.length}곳 그대로 남았다. 끈 형식은 가리지 않는다.`;
    else if (showMiss && edited) note = "'놓친 것 보기'는 표본에 넣어 둔 이름과 번호만 짚는다. 고친 글에 남은 이름, 번호, 주소는 직접 찾는다. 형식으로 가리기는 일부만 잡는다.";
    else if (showMiss && left.length) note = `형식으로는 잡히지 않은 것: ${left.join(", ")}. 이름은 정해진 형식이 없고, 띄어 쓴 전화번호는 형식과 다르다. 가리기는 일부만 잡으므로, 실제 기록 대신 가짜 데이터로 문제를 재현해 붙이는 것이 더 확실하다.`;
    else if (showMiss) note = "표본에 있던, 형식으로 놓치는 것들이 지금 글에는 없다. 그래도 형식에 없는 개인정보가 있는지 사람이 한 번 더 본다.";
    else note = `형식으로 ${sp.length}곳을 가렸다. 가린 글에 아직 개인정보가 남았는지 직접 찾아본 뒤 '놓친 것 보기'를 누른다.`;
    $("note").textContent = note;
  }
  document.querySelectorAll("[data-k]").forEach(b => b.addEventListener("click", () => { on[b.dataset.k] = !on[b.dataset.k]; render(); }));
  $("miss").addEventListener("click", () => { showMiss = !showMiss; render(); });
  $("sample").addEventListener("click", () => { $("src").value = L.SAMPLE; render(); });
  $("src").addEventListener("input", render);
  render();
})();
</script>
</body>
</html>
