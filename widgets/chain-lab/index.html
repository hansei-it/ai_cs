<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서비스를 거칠수록 느려지고 실패한다</title>
<meta name="description" content="주문 하나가 거치는 서비스 수, 부르는 방법(함수, HTTP), 차례로 부를지 함께 부를지, 실패하면 다시 부를지를 골라, 부르는 데 드는 시간과 주문 10만 건 가운데 실패하는 수를 본다">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2329;
    --muted: #5f6670;
    --line: #d9dde3;
    --soft: #f3f5f8;
    --accent: #3f51b5;
    --accent-bg: #e8ebfa;
    --read: #1971c2;
    --read-bg: #e7f1fb;
    --write: #c2410c;
    --write-bg: #fdf0e3;
    --good: #2b8a3e;
    --good-bg: #e6f4ea;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1e2129;
    --fg: #e2e4e9;
    --muted: #9aa0aa;
    --line: #3a3f4b;
    --soft: #262a33;
    --accent: #8c9eff;
    --accent-bg: #2b3156;
    --read: #74c0fc;
    --read-bg: #1d3247;
    --write: #ffa94d;
    --write-bg: #3d2a17;
    --good: #69db7c;
    --good-bg: #1f3326;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    padding: 14px 16px 16px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    word-break: keep-all;
  }
  .mono { font-family: "JetBrains Mono", Consolas, "D2Coding", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", monospace; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .lead { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 8px; }
  .row > .label { color: var(--muted); font-size: 14px; min-width: 4.5em; }
  .btn {
    font: inherit; font-size: 13px; color: var(--fg); background: var(--soft); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 9px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .btn.go { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=range] { accent-color: var(--accent); }
  .warn { color: var(--write); font-weight: 700; }
  .fine { color: var(--good); font-weight: 700; }
  .note { margin: 10px 0 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--soft); font-size: 14px; min-height: 2.6em; }
  .chain { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 6px 0 10px; min-height: 34px; }
  .chain .svc { border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 13px; background: var(--soft); }
  .chain .svc.me { border-color: var(--accent); background: var(--accent-bg); font-weight: 700; }
  .chain .svc.remote { border-color: var(--read); background: var(--read-bg); }
  .chain .link { font-size: 12px; color: var(--muted); }
  .chain.parallel { flex-direction: column; align-items: flex-start; }
  .out { display: flex; flex-wrap: wrap; gap: 6px 26px; font-size: 14px; }
  .out b { font-size: 20px; }
  @media (max-width: 480px) { body { padding: 10px; font-size: 14px; } }
</style>
</head>
<body>
<h1>서비스를 거칠수록 느려지고 실패한다</h1>
<p class="lead">주문 하나를 처리하려고 다른 기능을 몇 번 부른다. 모놀리스라면 함수 호출이고, 마이크로서비스라면 HTTP 호출이다. 시간은 이 PC에서 잰 중앙값이고(66번 측정 프로그램), 서비스마다 1,000번에 1번이나 100번에 1번 실패한다고 놓는다.</p>
<div class="row" role="group" aria-label="부르는 기능 수">
  <span class="label">부르는 수</span>
  <button class="btn" data-n="1">1개</button>
  <button class="btn" data-n="3">3개</button>
  <button class="btn" data-n="5">5개</button>
  <button class="btn" data-n="8">8개</button>
</div>
<div class="row" role="group" aria-label="부르는 방법">
  <span class="label">방법</span>
  <button class="btn" data-kind="func">함수 호출</button>
  <button class="btn" data-kind="kept">HTTP, 연결 이어 쓰기</button>
  <button class="btn" data-kind="new">HTTP, 매번 새 연결</button>
</div>
<div class="row" role="group" aria-label="차례">
  <span class="label">차례</span>
  <button class="btn" data-par="0">하나씩 차례로</button>
  <button class="btn" data-par="1">함께</button>
</div>
<div class="row" role="group" aria-label="서비스 하나의 성공률">
  <span class="label">성공률</span>
  <button class="btn" data-p="0.999">99.9%</button>
  <button class="btn" data-p="0.99">99%</button>
  <label style="font-size:13px;margin-left:8px"><input type="checkbox" id="retry"> 실패하면 한 번 다시 부른다</label>
</div>

<div class="chain" id="chain"></div>
<div class="out" id="out"></div>
<p class="note" id="note" aria-live="polite"></p>

<script>
// ==== 계산 로직 (화면과 분리: tests에서 그대로 불러 검증한다) ====
const ChainLogic = (() => {
  // 한 번 부르는 데 드는 시간(µs): 이 PC에서 66번 측정 프로그램으로 잰 5번의 가운데 값
  const KINDS = {
    func: { name: "함수 호출", us: 0.04 },
    kept: { name: "HTTP, 연결 이어 쓰기", us: 95 },
    new: { name: "HTTP, 매번 새 연결", us: 550 },
  };
  // n번 부른다. 차례로 부르면 시간이 더해지고, 함께 부르면 가장 긴 하나만큼 걸린다(여기서는 모두 같다)
  // 주문이 성공하려면 n번이 모두 성공해야 한다. 다시 부르면 한 번의 실패 확률이 (1-p)²로 준다(실패가 서로 상관없다고 할 때)
  // 함수 호출은 같은 프로그램 안이라 따로 실패하지 않는다고 놓는다
  function run(n, kind, parallel, p, retry) {
    const k = KINDS[kind];
    const remote = kind !== "func";
    const pCall = remote ? (retry ? 1 - (1 - p) ** 2 : p) : 1;
    const ok = pCall ** n;
    const us = (parallel ? 1 : n) * k.us;
    return { remote, us: Math.round(us * 100) / 100, success: ok, failedPer100k: Math.round(100000 * (1 - ok) * 10) / 10 };
  }
  const fmtTime = us => (us >= 1000 ? `${(us / 1000).toFixed(2)} ms` : us >= 1 ? `${Math.round(us)} µs` : `${us.toFixed(2)} µs`);
  return { KINDS, run, fmtTime };
})();
// ==== 계산 로직 끝 ====

// ---- 강의 사이트 안에 들어갔을 때: 테마와 높이 맞추기 ----
(() => {
  const media = matchMedia("(prefers-color-scheme: dark)");
  let parentBody = null;
  try { if (window.parent !== window) parentBody = window.parent.document.body; } catch { parentBody = null; }
  const sync = () => {
    let dark = media.matches;
    const scheme = parentBody && parentBody.getAttribute("data-md-color-scheme");
    if (scheme) dark = scheme === "slate";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  };
  sync();
  media.addEventListener("change", sync);
  if (parentBody) new MutationObserver(sync).observe(parentBody, { attributes: true, attributeFilter: ["data-md-color-scheme"] });

  // 문서 전체가 아니라 내용(body) 높이로 맞춘다. 그래야 내용이 줄 때 iframe도 줄어든다.
  const fit = () => {
    try {
      if (window.frameElement) window.frameElement.style.height = `${Math.ceil(document.body.getBoundingClientRect().height)}px`;
    } catch { /* 다른 출처에서 열린 경우 */ }
  };
  new ResizeObserver(fit).observe(document.body);
})();

// ---- 화면 ----
(() => {
  const L = ChainLogic;
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  let n = Number(q.get("n")) || 5, kind = q.get("kind") || "func",   // 처음에는 모놀리스(함수 호출)로, 문제 1의 답을 먼저 보이지 않게
      parallel = q.get("par") === "1", p = Number(q.get("p")) || 0.999;
  const NAMES = ["재고", "가격", "쿠폰", "결제", "배송", "알림", "포인트", "리뷰"];
  function render() {
    const retry = $("retry").checked;
    const par = parallel && kind !== "func" && n > 1;   // 함수 호출을 함께 부르려면 스레드가 있어야 해서, 하나만 부를 때는 함께가 없어서 고르지 않는다
    const r = L.run(n, kind, par, p, retry);
    const cls = r.remote ? "svc remote" : "svc";
    const items = NAMES.slice(0, n).map(s => `<span class="${cls}">${s}</span>`);
    $("chain").className = "chain" + (par ? " parallel" : "");
    $("chain").innerHTML = `<span class="svc me">주문</span>` + (par
      ? `<span class="link">→ 함께 부른다</span>${items.join("")}`
      : items.map(s => `<span class="link">→</span>${s}`).join(""));
    $("out").innerHTML = `<span>부르는 데 드는 시간 <b class="mono">${L.fmtTime(r.us)}</b></span>`
      + `<span>주문 10만 건 가운데 실패 <b class="mono">${r.failedPer100k.toLocaleString("ko-KR")}</b>건</span>`;
    let note;
    if (!r.remote) note = "함수 호출은 같은 프로그램 안이라 빠르고 따로 실패하지 않는다. 대신 그 프로그램이 멈추면 모든 기능이 함께 멈춘다.";
    else if (par) note = "서로 기다릴 필요가 없는 호출은 함께 부르면 가장 긴 하나만큼만 걸린다(문제 2). 그래도 하나라도 실패하면 주문이 실패하는 것은 같다.";
    else note = (n === 1 ? `HTTP로 한 번 부르면 함수 호출보다 ${kind === "new" ? "만 배 넘게" : "수천 배"} 느리고, 그 호출이 실패하면 주문도 실패한다.` : `HTTP로 ${n}번을 차례로 부르면 시간이 ${n}배로 쌓이고, 서비스마다 성공률이 곱해져 실패가 늘어난다.`) + (retry ? " 다시 부르면 실패가 크게 준다. 다만 결제처럼 두 번 하면 안 되는 일은 멱등 키가 있어야 다시 부를 수 있다(70번)." : " 실패하면 한 번 다시 부르기를 켜 본다.");
    $("note").textContent = note;
    document.querySelectorAll("[data-n]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.n) === n)));
    document.querySelectorAll("[data-kind]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.kind === kind)));
    document.querySelectorAll("[data-par]").forEach(b => { b.setAttribute("aria-pressed", String((b.dataset.par === "1") === par)); b.disabled = !r.remote || n === 1; });
    document.querySelectorAll("[data-p]").forEach(b => { b.setAttribute("aria-pressed", String(Number(b.dataset.p) === p)); b.disabled = !r.remote; });
    $("retry").disabled = !r.remote;
  }
  document.querySelectorAll("[data-n]").forEach(b => b.addEventListener("click", () => { n = Number(b.dataset.n); render(); }));
  document.querySelectorAll("[data-kind]").forEach(b => b.addEventListener("click", () => { kind = b.dataset.kind; render(); }));
  document.querySelectorAll("[data-par]").forEach(b => b.addEventListener("click", () => { parallel = b.dataset.par === "1"; render(); }));
  document.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => { p = Number(b.dataset.p); render(); }));
  $("retry").addEventListener("change", render);
  render();
})();
</script>
</body>
</html>
