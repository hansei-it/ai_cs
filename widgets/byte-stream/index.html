<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바이트의 흐름과 메시지</title>
<meta name="description" content="보낼 말을 골라 차례로 쓰고 읽는 버퍼 크기를 바꿔 가며, 바이트 모드 파이프(TCP도 같다)와 메시지 모드 파이프가 어떻게 다르게 읽히는지 본다">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2329;
    --muted: #5f6670;
    --line: #d9dde3;
    --soft: #f3f5f8;
    --accent: #3f51b5;
    --accent-bg: #e8ebfa;
    --read: #1971c2;
    --read-bg: #e7f1fb;
    --write: #c2410c;
    --write-bg: #fdf0e3;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1e2129;
    --fg: #e2e4e9;
    --muted: #9aa0aa;
    --line: #3a3f4b;
    --soft: #262a33;
    --accent: #8c9eff;
    --accent-bg: #2b3156;
    --read: #74c0fc;
    --read-bg: #1d3247;
    --write: #ffa94d;
    --write-bg: #3d2a17;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    padding: 14px 16px 16px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    word-break: keep-all;
  }
  .mono { font-family: "JetBrains Mono", Consolas, "D2Coding", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", monospace; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .lead { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 8px; }
  .row > .label { color: var(--muted); font-size: 14px; min-width: 4.5em; }
  .btn {
    font: inherit; font-size: 13px; color: var(--fg); background: var(--soft); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 9px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.w { border-color: var(--write); }
  .btn.r { border-color: var(--read); }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pipe { display: flex; align-items: center; gap: 6px; margin: 10px 0 4px; min-height: 40px; padding: 6px 8px; border: 2px solid var(--accent); border-radius: 20px; background: var(--accent-bg); overflow-x: auto; }
  .pipe .end { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .bytes { display: flex; gap: 4px; flex: 1; min-width: 0; }
  .msg { display: inline-flex; border: 1px solid var(--write); border-radius: 5px; background: var(--write-bg); padding: 1px 2px; }
  .flow { display: inline-flex; padding: 1px 2px; }
  .ch { display: inline-block; min-width: 13px; text-align: center; font-size: 15px; }
  .empty { color: var(--muted); font-size: 13px; }
  .log { margin: 8px 0 0; padding: 0; list-style: none; font-size: 14px; min-height: 1.5em; }
  .log li { padding: 2px 0; border-bottom: 1px dashed var(--line); }
  .log .got { color: var(--read); font-weight: 700; }
  .log .more { color: var(--write); font-size: 12px; margin-left: 6px; }
  .note { margin: 10px 0 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--soft); font-size: 14px; min-height: 2.6em; }
  @media (max-width: 480px) { body { padding: 10px; font-size: 14px; } }
</style>
</head>
<body>
<h1>바이트의 흐름과 메시지</h1>
<p class="lead">보내는 쪽이 <span class="mono">WriteFile</span>로 말을 하나씩 쓰고, 받는 쪽이 정한 크기의 버퍼로 <span class="mono">ReadFile</span>을 부른다. 결과는 이 PC에서 C로 실행해 본 동작과 같다.</p>

<div class="row" role="group" aria-label="파이프의 종류">
  <span class="label">파이프</span>
  <button class="btn" data-mode="byte">바이트 모드 (파이프의 기본값, TCP)</button>
  <button class="btn" data-mode="message">메시지 모드 (이름 있는 파이프만)</button>
</div>
<div class="row">
  <span class="label">쓰기</span>
  <button class="btn w mono" data-write="hello">hello</button>
  <button class="btn w mono" data-write="world">world</button>
  <button class="btn w mono" data-write="AI">AI</button>
  <button class="btn w mono" data-write="0123456789">0123456789</button>
</div>
<div class="row" role="group" aria-label="읽는 버퍼 크기">
  <span class="label">읽기 버퍼</span>
  <button class="btn mono" data-size="3">3</button>
  <button class="btn mono" data-size="8">8</button>
  <button class="btn mono" data-size="64">64</button>
  <button class="btn r" id="read">읽기</button>
  <button class="btn" id="reset">처음으로</button>
</div>

<div class="pipe"><span class="end">쓰는 쪽 →</span><div class="bytes mono" id="bytes"></div><span class="end">→ 읽는 쪽</span></div>
<ol class="log mono" id="log"></ol>
<p class="note" id="note" aria-live="polite"></p>

<script>
// ==== 계산 로직 (화면과 분리: tests에서 그대로 불러 검증한다) ====
const StreamLogic = (() => {
  // q: 파이프 안에 남은 데이터. 메시지 모드는 쓴 단위(메시지)를 지키고, 바이트 모드는 경계 없이 이어진다
  const initial = mode => ({ mode, q: [] });
  const write = (s, msg) => ({ mode: s.mode, q: [...s.q, msg] });
  const pending = s => s.q.join("");
  // n바이트 버퍼로 한 번 읽는다. more: 메시지 모드에서 메시지가 버퍼보다 커서 남은 것이 있다(ERROR_MORE_DATA)
  function read(s, n) {
    if (!s.q.length) return { state: s, got: "", more: false, empty: true };
    if (s.mode === "byte") {
      const all = pending(s);
      const rest = all.slice(n);
      return { state: { mode: s.mode, q: rest ? [rest] : [] }, got: all.slice(0, n), more: false, empty: false };
    }
    const head = s.q[0], rest = head.slice(n);
    return { state: { mode: s.mode, q: rest ? [rest, ...s.q.slice(1)] : s.q.slice(1) }, got: head.slice(0, n), more: rest.length > 0, empty: false };
  }
  return { initial, write, read, pending };
})();
// ==== 계산 로직 끝 ====

// ---- 강의 사이트 안에 들어갔을 때: 테마와 높이 맞추기 ----
(() => {
  const media = matchMedia("(prefers-color-scheme: dark)");
  let parentBody = null;
  try { if (window.parent !== window) parentBody = window.parent.document.body; } catch { parentBody = null; }
  const sync = () => {
    let dark = media.matches;
    const scheme = parentBody && parentBody.getAttribute("data-md-color-scheme");
    if (scheme) dark = scheme === "slate";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  };
  sync();
  media.addEventListener("change", sync);
  if (parentBody) new MutationObserver(sync).observe(parentBody, { attributes: true, attributeFilter: ["data-md-color-scheme"] });

  // 문서 전체가 아니라 내용(body) 높이로 맞춘다. 그래야 내용이 줄 때 iframe도 줄어든다.
  const fit = () => {
    try {
      if (window.frameElement) window.frameElement.style.height = `${Math.ceil(document.body.getBoundingClientRect().height)}px`;
    } catch { /* 다른 출처에서 열린 경우 */ }
  };
  new ResizeObserver(fit).observe(document.body);
})();

// ---- 화면 ----
(() => {
  const L = StreamLogic;
  const $ = id => document.getElementById(id);
  let s, size = 64, reads = [];

  const chars = str => [...str].map(c => `<span class="ch">${c}</span>`).join("");
  function render(msg) {
    const box = s.mode === "message" ? s.q.map(m => `<span class="msg">${chars(m)}</span>`).join("")
      : (s.q.length ? `<span class="flow">${chars(L.pending(s))}</span>` : "");
    $("bytes").innerHTML = box || `<span class="empty">비어 있다</span>`;
    $("log").innerHTML = reads.map((r, i) => `<li>읽기 ${i + 1} (버퍼 ${r.n}): <span class="got">"${r.got}"</span> ${r.got.length}바이트${r.more ? `<span class="more">ERROR_MORE_DATA</span>` : ""}</li>`).join("");
    $("note").textContent = msg;
    document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === s.mode)));
    document.querySelectorAll("[data-size]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.size) === size)));
  }
  function start(mode) {
    s = L.initial(mode); reads = [];
    render(mode === "byte" ? "hello와 world를 차례로 쓰고, 버퍼 64로 한 번 읽어 본다."
      : "메시지 모드다. hello와 world를 쓰고 버퍼 64로 읽은 뒤, 버퍼 3으로도 읽어 본다.");
  }
  document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => start(b.dataset.mode)));
  $("reset").addEventListener("click", () => start(s.mode));
  document.querySelectorAll("[data-size]").forEach(b => b.addEventListener("click", () => { size = Number(b.dataset.size); render($("note").textContent); }));
  document.querySelectorAll("[data-write]").forEach(b => b.addEventListener("click", () => {
    s = L.write(s, b.dataset.write);
    render(`"${b.dataset.write}"를 썼다. ` + (s.mode === "byte" ? "바이트 모드에서는 앞에 쓴 것과 이어 붙어 경계가 사라진다." : "메시지 모드에서는 쓴 단위가 하나의 메시지로 남는다."));
  }));
  $("read").addEventListener("click", () => {
    const r = L.read(s, size);
    if (r.empty) { render("파이프가 비어 있다. 실제 ReadFile은 데이터가 올 때까지 기다린다(블로킹, 36번 항목)."); return; }
    s = r.state;
    reads.push({ n: size, got: r.got, more: r.more });
    let msg;
    if (s.mode === "byte") msg = `버퍼가 담을 수 있는 만큼 ${r.got.length}바이트를 읽었다. 몇 번에 나눠 썼는지는 받는 쪽이 알 수 없다. 그래서 줄바꿈이나 길이를 붙여 경계를 직접 표시한다.`;
    else if (r.more) msg = `메시지가 버퍼보다 커서 ${r.got.length}바이트만 받고 ERROR_MORE_DATA를 받았다. 다시 읽으면 같은 메시지의 나머지가 온다.`;
    else msg = `메시지 하나를 받았다. 뒤에 쓴 메시지와 섞이지 않는다.`;
    render(msg);
  });
  const q = new URLSearchParams(location.search).get("mode");
  start(q === "message" ? "message" : "byte");
})();
</script>
</body>
</html>
