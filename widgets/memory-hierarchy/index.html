<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>평균 접근 시간 계산기</title>
<meta name="description" content="층마다 걸리는 시간과 적중률을 바꿔 평균 접근 시간이 어떻게 변하는지 본다">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2329;
    --muted: #5f6670;
    --line: #d9dde3;
    --soft: #f3f5f8;
    --accent: #3f51b5;
    --accent-fg: #ffffff;
    --c1: #2f9e44;
    --c2: #1971c2;
    --c3: #7048e8;
    --c4: #c2410c;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1e2129;
    --fg: #e2e4e9;
    --muted: #9aa0aa;
    --line: #3a3f4b;
    --soft: #262a33;
    --accent: #8c9eff;
    --accent-fg: #11131a;
    --c1: #69db7c;
    --c2: #74c0fc;
    --c3: #b197fc;
    --c4: #ffa94d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    padding: 14px 16px 16px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    word-break: keep-all;
  }
  .mono, input.mono { font-family: "JetBrains Mono", Consolas, "D2Coding", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", monospace; }
  h1 { font-size: 16px; margin: 0 0 10px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 10px; }
  .row > .label { color: var(--muted); font-size: 14px; }
  .btn {
    font: inherit; font-size: 13px; color: var(--fg); background: var(--soft); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 8px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  table { border-collapse: collapse; width: 100%; font-size: 14px; margin-bottom: 12px; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  td.name { white-space: nowrap; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
  input[type="number"] {
    font: inherit; color: var(--fg); background: var(--soft); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 6px; width: 5.5em;
  }
  .hit { display: flex; align-items: center; gap: 8px; }
  /* 슬라이더는 기본 폭(약 130px) 아래로 줄지 않으므로 폭을 0에서 늘려 남은 칸을 채운다 (좁은 화면에서 넘치지 않게) */
  .hit input[type="range"] { flex: 1 1 auto; width: 0; min-width: 40px; accent-color: var(--accent); }
  .hit output { min-width: 3.2em; text-align: right; }
  tr.off td:not(.use) { opacity: 0.4; }

  .result { font-size: 15px; margin: 0 0 4px; }
  .result .big { font-size: 22px; font-weight: 700; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  .bar-title { font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
  .bar { display: flex; height: 22px; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); background: var(--soft); }
  .bar span { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; margin-top: 6px; }
  .formula { margin: 12px 0 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--soft); font-size: 13px; overflow-wrap: anywhere; }
  .hint { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  @media (max-width: 480px) {
    body { padding: 10px; font-size: 14px; }
    input[type="number"] { width: 4.6em; }
  }
</style>
</head>
<body>
<h1>평균 접근 시간 계산기</h1>

<div class="row" role="group" aria-label="예시">
  <span class="label">예시</span>
  <button class="btn" data-preset="example">세 단계 캐시 (95% · 80% · 50%)</button>
  <button class="btn" data-preset="one90">캐시 하나, 적중률 90%</button>
  <button class="btn" data-preset="one99">캐시 하나, 적중률 99%</button>
  <button class="btn" data-preset="none">캐시 없음</button>
</div>

<table>
  <thead><tr><th>사용</th><th>단계</th><th>걸리는 시간 (ns)</th><th>적중률</th></tr></thead>
  <tbody id="levels"></tbody>
</table>

<p class="result">평균 접근 시간 <span class="big mono" id="avg"></span></p>
<p class="sub" id="compare"></p>

<div class="bar-title">평균 시간이 어디서 생기나</div>
<div class="bar" id="time-bar" role="img" aria-label="단계별 시간 기여"></div>
<div class="legend" id="time-legend"></div>

<div class="bar-title">읽으려는 값을 어디서 찾나</div>
<div class="bar" id="found-bar" role="img" aria-label="단계별로 찾는 비율"></div>
<div class="legend" id="found-legend"></div>

<p class="formula mono" id="formula"></p>
<p class="hint">각 단계는 위 단계에서 못 찾았을 때만 찾아본다. 적중률은 그 단계까지 내려온 요청 중에서 찾는 비율이고, 못 찾아도 그 단계를 찾아보는 시간은 든다. 메모리에는 항상 있다.</p>

<script>
// ==== 계산 로직 (화면과 분리: tests에서 그대로 불러 검증한다) ====
const MemLogic = (() => {
  // levels: [{ name, ns, hit, on }] 바깥(L1)부터, mem: 메모리 ns
  // 평균 = t1 + (1 − h1) × (t2 + (1 − h2) × (… + 메모리))
  function amat(levels, mem) {
    let t = mem;
    for (const l of levels.filter(l => l.on).reverse()) t = l.ns + (1 - l.hit) * t;
    return t;
  }

  // 단계마다 평균 시간에 보태는 몫과, 값을 그 단계에서 찾는 비율
  function breakdown(levels, mem) {
    let reach = 1;
    const parts = [], found = [];
    for (const l of levels) {
      if (!l.on) { parts.push(0); found.push(0); continue; }
      parts.push(reach * l.ns);
      found.push(reach * l.hit);
      reach *= 1 - l.hit;
    }
    parts.push(reach * mem);
    found.push(reach);
    return { parts, found };
  }

  // 1ns를 1초로 늘렸을 때의 시간
  function humanTime(ns) {
    const s = ns;
    if (s < 60) return `${round(s, s < 10 ? 1 : 0)}초`;
    if (s < 3600) return `약 ${round(s / 60, 1)}분`;
    if (s < 86400) return `약 ${round(s / 3600, 1)}시간`;
    return `약 ${round(s / 86400, 1)}일`;
  }

  function round(v, digits) {
    const f = 10 ** digits;
    return String(Math.round(v * f) / f);
  }

  const LEVELS = ["L1 캐시", "L2 캐시", "L3 캐시"];
  const PRESETS = {
    example: { ns: [1, 4, 20], hit: [0.95, 0.8, 0.5], on: [true, true, true], mem: 100 },
    one90: { ns: [1, 4, 20], hit: [0.9, 0.8, 0.5], on: [true, false, false], mem: 100 },
    one99: { ns: [1, 4, 20], hit: [0.99, 0.8, 0.5], on: [true, false, false], mem: 100 },
    none: { ns: [1, 4, 20], hit: [0.95, 0.8, 0.5], on: [false, false, false], mem: 100 },
  };
  const fromPreset = p => ({
    levels: LEVELS.map((name, i) => ({ name, ns: p.ns[i], hit: p.hit[i], on: p.on[i] })),
    mem: p.mem,
  });

  return { amat, breakdown, humanTime, round, LEVELS, PRESETS, fromPreset };
})();
// ==== 계산 로직 끝 ====

// ---- 강의 사이트 안에 들어갔을 때: 테마와 높이 맞추기 ----
(() => {
  const media = matchMedia("(prefers-color-scheme: dark)");
  let parentBody = null;
  try { if (window.parent !== window) parentBody = window.parent.document.body; } catch { parentBody = null; }
  const sync = () => {
    let dark = media.matches;
    const scheme = parentBody && parentBody.getAttribute("data-md-color-scheme");
    if (scheme) dark = scheme === "slate";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  };
  sync();
  media.addEventListener("change", sync);
  if (parentBody) new MutationObserver(sync).observe(parentBody, { attributes: true, attributeFilter: ["data-md-color-scheme"] });

  // 문서 전체가 아니라 내용(body) 높이로 맞춘다. 그래야 내용이 줄 때 iframe도 줄어든다.
  const fit = () => {
    try {
      if (window.frameElement) window.frameElement.style.height = `${Math.ceil(document.body.getBoundingClientRect().height)}px`;
    } catch { /* 다른 출처에서 열린 경우 */ }
  };
  new ResizeObserver(fit).observe(document.body);
})();

// ---- 화면 ----
(() => {
  const M = MemLogic;
  const $ = id => document.getElementById(id);
  const COLORS = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)"];
  let state = M.fromPreset(M.PRESETS.example);

  function buildRows() {
    const tbody = $("levels");
    tbody.replaceChildren();
    state.levels.forEach((l, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML =
        `<td class="use"><input type="checkbox" aria-label="${l.name} 사용"></td>` +
        `<td class="name"><span class="swatch" style="background:${COLORS[i]}"></span>${l.name}</td>` +
        `<td><input type="number" class="mono" min="0.1" step="0.1" aria-label="${l.name} 걸리는 시간 (ns)"></td>` +
        `<td><div class="hit"><input type="range" min="0" max="100" step="1" aria-label="${l.name} 적중률"><output class="mono"></output></div></td>`;
      const [use, ns, hit] = tr.querySelectorAll("input");
      use.addEventListener("change", () => { l.on = use.checked; clearPreset(); render(); });
      ns.addEventListener("input", () => { const v = Number(ns.value); if (v > 0) { l.ns = v; clearPreset(); render(); } });
      hit.addEventListener("input", () => { l.hit = Number(hit.value) / 100; clearPreset(); render(); });
      tbody.append(tr);
    });
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td class="use"></td><td class="name"><span class="swatch" style="background:${COLORS[3]}"></span>메모리</td>` +
      `<td><input type="number" class="mono" min="1" step="1" id="mem-ns" aria-label="메모리 걸리는 시간 (ns)"></td><td>항상 있다</td>`;
    tr.querySelector("input").addEventListener("input", e => { const v = Number(e.target.value); if (v > 0) { state.mem = v; clearPreset(); render(); } });
    tbody.append(tr);
  }

  function syncInputs() {
    const rows = $("levels").querySelectorAll("tr");
    state.levels.forEach((l, i) => {
      const [use, ns, hit] = rows[i].querySelectorAll("input");
      use.checked = l.on;
      ns.value = l.ns;
      hit.value = Math.round(l.hit * 100);
      rows[i].classList.toggle("off", !l.on);
    });
    $("mem-ns").value = state.mem;
  }

  function clearPreset() {
    document.querySelectorAll("[data-preset]").forEach(b => b.setAttribute("aria-pressed", "false"));
  }

  function bar(el, legend, values, labels, fmt) {
    const total = values.reduce((a, b) => a + b, 0) || 1;
    el.replaceChildren();
    legend.replaceChildren();
    values.forEach((v, i) => {
      if (v <= 0) return;
      const seg = document.createElement("span");
      seg.style.width = `${(v / total) * 100}%`;
      seg.style.background = COLORS[i];
      seg.title = `${labels[i]}: ${fmt(v)}`;
      el.append(seg);
      const item = document.createElement("span");
      item.innerHTML = `<span class="swatch" style="background:${COLORS[i]}"></span>`;
      item.append(`${labels[i]} ${fmt(v)}`);
      legend.append(item);
    });
  }

  function render() {
    state.levels.forEach((l, i) => {
      const row = $("levels").querySelectorAll("tr")[i];
      row.classList.toggle("off", !l.on);
      row.querySelector("output").textContent = `${Math.round(l.hit * 100)}%`;
    });
    const avg = M.amat(state.levels, state.mem);
    const { parts, found } = M.breakdown(state.levels, state.mem);
    $("avg").textContent = `${M.round(avg, 2)} ns`;
    const ratio = state.mem / avg;
    const base = `언제나 메모리에서 읽을 때(${state.mem} ns)`;
    $("compare").textContent =
      (Math.abs(ratio - 1) < 1e-9 ? `${base}와 같다. ` : ratio > 1 ? `${base}보다 ${M.round(ratio, 1)}배 빠르다. ` : `${base}보다 오히려 느리다. `) +
      `1ns를 1초로 늘리면 ${M.humanTime(avg)}.`;
    const labels = [...state.levels.map(l => l.name), "메모리"];
    bar($("time-bar"), $("time-legend"), parts, labels, v => `${M.round(v, 2)} ns`);
    bar($("found-bar"), $("found-legend"), found, labels, v => `${M.round(v * 100, 2)}%`);
    const on = state.levels.filter(l => l.on);
    let f = String(state.mem);
    for (const l of [...on].reverse()) f = `${l.ns} + (1 − ${M.round(l.hit, 2)}) × (${f})`;
    $("formula").textContent = on.length ? `평균 = ${f} = ${M.round(avg, 2)} ns` : `캐시가 없으니 언제나 메모리까지 간다: 평균 = ${state.mem} ns`;
  }

  document.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => {
    state = M.fromPreset(M.PRESETS[b.dataset.preset]);
    buildRows(); syncInputs();
    document.querySelectorAll("[data-preset]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    render();
  }));

  buildRows();
  syncInputs();
  document.querySelector('[data-preset="example"]').setAttribute("aria-pressed", "true");
  render();
})();
</script>
</body>
</html>
