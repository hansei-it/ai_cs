<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>패킷을 잃을 때 TCP와 UDP</title>
<meta name="description" content="패킷을 잃는 비율을 고르고 무작위 순서를 바꿔 가며, 같은 패킷 10개를 UDP와 TCP로 보낼 때 언제 무엇을 받는지와 TCP의 다시 보내기, 차례 기다리기를 본다">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2329;
    --muted: #5f6670;
    --line: #d9dde3;
    --soft: #f3f5f8;
    --accent: #3f51b5;
    --accent-bg: #e8ebfa;
    --read: #1971c2;
    --read-bg: #e7f1fb;
    --write: #c2410c;
    --write-bg: #fdf0e3;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1e2129;
    --fg: #e2e4e9;
    --muted: #9aa0aa;
    --line: #3a3f4b;
    --soft: #262a33;
    --accent: #8c9eff;
    --accent-bg: #2b3156;
    --read: #74c0fc;
    --read-bg: #1d3247;
    --write: #ffa94d;
    --write-bg: #3d2a17;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    padding: 14px 16px 16px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    word-break: keep-all;
  }
  .mono { font-family: "JetBrains Mono", Consolas, "D2Coding", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", monospace; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .lead { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 8px; }
  .row > .label { color: var(--muted); font-size: 14px; min-width: 5em; }
  .btn {
    font: inherit; font-size: 13px; color: var(--fg); background: var(--soft); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 9px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seed { font-size: 13px; color: var(--muted); }
  .chart { overflow-x: auto; }
  .chart svg { display: block; width: 100%; min-width: 520px; height: auto; }
  svg text { fill: var(--muted); font-size: 11px; font-family: "JetBrains Mono", Consolas, "Malgun Gothic", monospace; }
  svg .hdr { fill: var(--fg); font-family: inherit; font-size: 12px; font-weight: 700; }
  svg .grid { stroke: var(--line); stroke-width: 1; }
  svg .hs { fill: var(--accent-bg); }
  svg .udp { fill: var(--read); }
  svg .tcp { fill: var(--accent); }
  svg .retx { fill: var(--write); }
  svg .lost { stroke: var(--muted); stroke-width: 2; }
  svg .wait { stroke: var(--write); stroke-width: 2; stroke-dasharray: 3 3; }
  svg .dlv { fill: none; stroke: var(--write); stroke-width: 2; }
  .legend { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 4px; }
  .legend b.u { color: var(--read); }
  .legend b.t { color: var(--accent); }
  .legend b.r { color: var(--write); }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .stat { flex: 1 1 200px; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; background: var(--soft); font-size: 13px; }
  .stat b { font-size: 15px; }
  .note { margin: 10px 0 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--soft); font-size: 14px; min-height: 2.6em; }
  @media (max-width: 480px) { body { padding: 10px; font-size: 14px; } }
</style>
</head>
<body>
<h1>패킷을 잃을 때 TCP와 UDP</h1>
<p class="lead">패킷 10개를 5ms 간격으로 보낸다. 한 방향에 20ms(왕복 40ms) 걸리는 길에서 패킷을 일정 비율로 잃는다(모형). 처음 보낼 때는 TCP와 UDP가 같은 패킷을 잃는다. TCP는 잃은 패킷을 늘 80ms 뒤에 다시 보낸다(실제 TCP는 상황에 따라 이 시간을 바꾼다).</p>

<div class="row" role="group" aria-label="잃는 비율">
  <span class="label">잃는 비율</span>
  <button class="btn mono" data-p="0">0%</button>
  <button class="btn mono" data-p="0.1">10%</button>
  <button class="btn mono" data-p="0.2">20%</button>
  <button class="btn mono" data-p="0.3">30%</button>
</div>
<div class="row">
  <button class="btn" id="next">다른 무작위 순서</button>
  <span class="seed" id="seed"></span>
</div>

<div class="chart"><svg id="chart" viewBox="0 0 600 330" role="img" aria-label="패킷마다 UDP와 TCP로 받은 때"></svg></div>
<div class="legend">
  <span><b class="u">■</b> UDP 도착</span>
  <span><b class="t">■</b> TCP 도착</span>
  <span><b class="r">■</b> TCP 다시 보내서 도착</span>
  <span>× 잃음</span>
  <span><b class="r">◇</b> TCP가 프로그램에 넘긴 때 (점선: 앞 번호를 기다림)</span>
</div>
<div class="stats" id="stats"></div>
<p class="note" id="note" aria-live="polite"></p>

<script>
// ==== 계산 로직 (화면과 분리: tests에서 그대로 불러 검증한다) ====
const LossLogic = (() => {
  // 시간 단위 ms. 한 방향 20ms(왕복 40ms), 5ms마다 하나씩 보낸다.
  // TCP는 연결을 맺느라 왕복 한 번 뒤에 보내기 시작하고, 잃은 세그먼트는 보낸 지 RTO(80ms) 뒤에 다시 보낸다.
  const N = 10, GAP = 5, OWD = 20, RTT = 40, RTO = 80;
  // 잃을지는 선형 합동 생성기로 정한다. 0 이상 1 미만
  function lcg(seed) {
    let x = seed >>> 0;
    return () => { x = (Math.imul(x, 1103515245) + 12345) >>> 0; return ((x >>> 16) & 0x7fff) / 32768; };
  }
  // 첫 전송은 UDP와 TCP가 같은 수를 쓰고(같은 패킷을 잃는다), TCP가 다시 보낼 때는 따로 센다
  function run(p, seed) {
    const first = lcg(seed), again = lcg(seed + 1000);
    const lostFirst = Array.from({ length: N }, () => first() < p);
    const udp = lostFirst.map((l, i) => (l ? null : i * GAP + OWD));
    const tcp = [];
    let last = 0;
    for (let i = 0; i < N; i++) {
      let t = RTT + i * GAP, lost = lostFirst[i];
      const lostAt = [];
      while (lost) { lostAt.push(t + OWD); t += RTO; lost = again() < p; }
      const arrive = t + OWD;
      last = Math.max(arrive, last);          // 받는 프로그램에는 차례대로만 넘긴다
      tcp.push({ tries: lostAt.length + 1, lostAt, arrive, deliver: last });
    }
    const got = udp.filter(t => t !== null);
    return {
      udp, tcp, udpGot: got.length, udpLast: got.length ? Math.max(...got) : null,
      retx: tcp.reduce((s, x) => s + x.tries - 1, 0), done: last,
    };
  }
  return { N, GAP, OWD, RTT, RTO, run };
})();
// ==== 계산 로직 끝 ====

// ---- 강의 사이트 안에 들어갔을 때: 테마와 높이 맞추기 ----
(() => {
  const media = matchMedia("(prefers-color-scheme: dark)");
  let parentBody = null;
  try { if (window.parent !== window) parentBody = window.parent.document.body; } catch { parentBody = null; }
  const sync = () => {
    let dark = media.matches;
    const scheme = parentBody && parentBody.getAttribute("data-md-color-scheme");
    if (scheme) dark = scheme === "slate";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  };
  sync();
  media.addEventListener("change", sync);
  if (parentBody) new MutationObserver(sync).observe(parentBody, { attributes: true, attributeFilter: ["data-md-color-scheme"] });

  // 문서 전체가 아니라 내용(body) 높이로 맞춘다. 그래야 내용이 줄 때 iframe도 줄어든다.
  const fit = () => {
    try {
      if (window.frameElement) window.frameElement.style.height = `${Math.ceil(document.body.getBoundingClientRect().height)}px`;
    } catch { /* 다른 출처에서 열린 경우 */ }
  };
  new ResizeObserver(fit).observe(document.body);
})();

// ---- 화면 ----
(() => {
  const L = LossLogic;
  const $ = id => document.getElementById(id);
  const X0 = 64, XW = 520, Y0 = 34, RH = 26;
  let p = 0.2, seed = 1;

  function render() {
    const r = L.run(p, seed);
    const maxT = Math.max(150, Math.ceil((Math.max(r.done, r.udpLast || 0) + 10) / 50) * 50);
    const x = t => X0 + (XW * t) / maxT;
    let g = `<rect class="hs" x="${x(0)}" y="${Y0 - 6}" width="${x(L.RTT) - x(0)}" height="${L.N * RH + 4}"/>
      <text x="${(x(0) + x(L.RTT)) / 2}" y="${Y0 - 10}" text-anchor="middle">TCP 연결 맺기</text>`;
    for (let t = 0; t <= maxT; t += 50) {
      g += `<line class="grid" x1="${x(t)}" y1="${Y0 - 6}" x2="${x(t)}" y2="${Y0 + L.N * RH}"/>
        <text x="${x(t)}" y="${Y0 + L.N * RH + 14}" text-anchor="middle">${t}</text>`;
    }
    g += `<text x="${X0 + XW}" y="${Y0 + L.N * RH + 28}" text-anchor="end">ms</text>`;
    g += `<text class="hdr" x="6" y="${Y0 - 10}">번호</text>`;
    const mark = (t, y) => `<path class="lost" d="M${x(t) - 4} ${y - 4} l8 8 m0 -8 l-8 8"/>`;
    for (let i = 0; i < L.N; i++) {
      const y = Y0 + i * RH, yu = y + 5, yt = y + 16;
      g += `<text x="10" y="${y + 15}">${i + 1}</text>`;
      g += `<text x="${X0 - 6}" y="${yu + 3}" text-anchor="end" style="font-size:9px">U</text><text x="${X0 - 6}" y="${yt + 3}" text-anchor="end" style="font-size:9px">T</text>`;
      g += r.udp[i] === null ? mark(i * L.GAP + L.OWD, yu) : `<rect class="udp" x="${x(r.udp[i]) - 3}" y="${yu - 4}" width="6" height="8"/>`;
      const s = r.tcp[i];
      s.lostAt.forEach(t => { g += mark(t, yt); });
      if (s.deliver > s.arrive) g += `<line class="wait" x1="${x(s.arrive)}" y1="${yt}" x2="${x(s.deliver)}" y2="${yt}"/>`;
      g += `<rect class="${s.tries > 1 ? "retx" : "tcp"}" x="${x(s.arrive) - 3}" y="${yt - 4}" width="6" height="8"/>`;
      g += `<path class="dlv" d="M${x(s.deliver)} ${yt - 6} l5 6 l-5 6 l-5 -6 z"/>`;
    }
    $("chart").innerHTML = g;

    $("seed").textContent = p === 0 ? "잃는 것이 없으면 무작위 순서와 상관없다" : `무작위 순서 ${seed}번`;
    $("stats").innerHTML = `<div class="stat">UDP: 받은 것 <b>${r.udpGot}/${L.N}</b>, 마지막 도착 <b>${r.udpLast === null ? "-" : r.udpLast + "ms"}</b></div>
      <div class="stat">TCP: 받은 것 <b>${L.N}/${L.N}</b>, 다시 보낸 횟수 <b>${r.retx}</b>, 프로그램이 다 받은 때 <b>${r.done}ms</b></div>`;
    let note;
    if (r.retx === 0) note = `잃은 것이 없으면 둘 다 10개를 모두 받는다. TCP는 연결을 맺는 왕복 한 번(${L.RTT}ms)만큼 늦게 끝난다(${r.udpLast}ms 대 ${r.done}ms).`;
    else {
      const waited = r.tcp.filter(s => s.deliver > s.arrive).length;
      note = `UDP는 잃은 ${L.N - r.udpGot}개를 끝내 받지 못했다. 다시 물을지 버릴지는 프로그램이 정한다. TCP는 잃은 것을 ${L.RTO}ms 뒤에 다시 보내 모두 받았지만,`
        + (waited ? ` 먼저 도착한 ${waited}개도 앞 번호가 올 때까지 프로그램에 넘기지 않고 기다렸다(점선). 그래서 ${r.done}ms에야 다 받았다.` : ` 그만큼 늦어져 ${r.done}ms에야 다 받았다.`);
    }
    $("note").textContent = note;
    document.querySelectorAll("[data-p]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.p) === p)));
    $("next").disabled = p === 0;
  }
  document.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => { p = Number(b.dataset.p); seed = 1; render(); }));
  $("next").addEventListener("click", () => { seed += 1; render(); });
  const q = new URLSearchParams(location.search);
  if (["0", "0.1", "0.2", "0.3"].includes(q.get("loss"))) p = Number(q.get("loss"));
  if (Number(q.get("seed")) >= 1) seed = Math.floor(Number(q.get("seed")));
  render();
})();
</script>
</body>
</html>
