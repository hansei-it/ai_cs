<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포인터 실험실</title>
<meta name="description" content="C 문장 버튼을 눌러 실행하며, 포인터 p가 가리키는 칸과 *p로 바뀌는 값, p + 1이 움직이는 거리를 메모리 그림으로 본다">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2329;
    --muted: #5f6670;
    --line: #d9dde3;
    --soft: #f3f5f8;
    --accent: #3f51b5;
    --accent-bg: #e8ebfa;
    --warn: #c2410c;
    --warn-bg: #fdf0e3;
    --changed: #fff3bf;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1e2129;
    --fg: #e2e4e9;
    --muted: #9aa0aa;
    --line: #3a3f4b;
    --soft: #262a33;
    --accent: #8c9eff;
    --accent-bg: #2b3156;
    --warn: #ffa94d;
    --warn-bg: #3d2c18;
    --changed: #4a4220;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    padding: 14px 16px 16px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    word-break: keep-all;
  }
  .mono, .btn.code { font-family: "JetBrains Mono", Consolas, "D2Coding", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", monospace; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .lead { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .palette { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .btn {
    font: inherit; font-size: 13px; color: var(--fg); background: var(--soft); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 9px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.code { font-size: 13px; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .main { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-start; }
  .panel h2 { font-size: 13px; color: var(--muted); font-weight: 400; margin: 0 0 6px; }
  table { border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 400; font-size: 12px; color: var(--muted); padding: 2px 8px; }
  td { padding: 5px 8px; border-top: 1px solid var(--line); white-space: nowrap; }
  tr.target td { background: var(--accent-bg); }
  tr.target td.arrow { color: var(--accent); font-weight: 700; }
  tr.outside td { background: var(--warn-bg); }
  tr.outside td.arrow { color: var(--warn); font-weight: 700; }
  td.val.changed { background: var(--changed); }
  td.arrow { width: 5.5em; text-align: right; }
  .log { font-size: 13px; background: var(--soft); border-radius: 6px; padding: 6px 10px; min-width: 220px; min-height: 120px; white-space: pre; }
  .log .bad { color: var(--warn); }
  .note { margin: 12px 0 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--soft); font-size: 14px; min-height: 2.6em; }
  .note.bad { border-left-color: var(--warn); background: var(--warn-bg); }
  @media (max-width: 480px) {
    body { padding: 10px; font-size: 14px; }
    table { font-size: 13px; }
    td { padding: 4px 5px; }
  }
</style>
</head>
<body>
<h1>포인터 실험실</h1>
<p class="lead">아래 변수들이 있는 상태에서 문장을 하나씩 눌러 실행한다. 주소는 설명을 위해 정한 값이다 (int 4바이트, 포인터 8바이트).</p>
<div class="palette" id="palette"></div>
<div class="main">
  <div class="panel">
    <h2>메모리</h2>
    <table>
      <thead><tr><th></th><th>주소</th><th>이름</th><th>값</th></tr></thead>
      <tbody id="mem"></tbody>
    </table>
  </div>
  <div class="panel">
    <h2>실행한 문장</h2>
    <div class="log mono" id="log"></div>
  </div>
</div>
<p class="note" id="note" aria-live="polite"></p>

<script>
// ==== 계산 로직 (화면과 분리: tests에서 그대로 불러 검증한다) ====
const PointerLogic = (() => {
  // int a = 5, b = 8; int arr[3] = {10, 20, 30}; int *p;  (p는 아직 초기화하지 않았다)
  const OBJECTS = [
    { name: "a", addr: 0x1000, len: 1 },
    { name: "b", addr: 0x1004, len: 1 },
    { name: "arr", addr: 0x1008, len: 3 },
  ];
  const P_ADDR = 0x1018;
  const STMTS = ["p = &a;", "p = &b;", "p = arr;", "p = p + 1;", "p = p - 1;", "*p = *p + 100;", "*p = 0;", "printf(\"%d\\n\", *p);", "a = 0;"];

  const initial = () => ({ vals: { a: [5], b: [8], arr: [10, 20, 30] }, p: null, out: "" });
  const clone = s => ({ vals: { a: [...s.vals.a], b: [...s.vals.b], arr: [...s.vals.arr] }, p: s.p && { ...s.p }, out: s.out });
  const hex = n => "0x" + n.toString(16).toUpperCase();
  // 조사: 숫자는 읽었을 때 끝소리로 고른다 (2 이, 4 사, 5 오, 9 구는 받침 없음, 0·3·6은 받침, 1·7·8은 ㄹ 받침)
  const last = x => String(x).replace(/\]$/, "").slice(-1);
  const plain = x => /^[ab]$/.test(String(x)) || "2459".includes(last(x));
  const iga = x => (plain(x) ? "가" : "이");
  const eul = x => (plain(x) ? "를" : "을");
  const ro = x => ("036".includes(last(x)) ? "으로" : "로");
  const cellName = (obj, i) => (obj.len > 1 ? `${obj.name}[${i}]` : obj.name);

  // p가 가리키는 곳: { obj, idx } → 주소와 이름
  function where(p) {
    const obj = OBJECTS.find(o => o.name === p.obj);
    const addr = obj.addr + p.idx * 4;
    const inside = p.idx >= 0 && p.idx < obj.len;
    return { addr, inside, name: inside ? cellName(obj, p.idx) : null, obj, onePast: p.idx === obj.len };
  }

  // 문장 하나를 실행한다. 결과: { state, ok, note }
  function exec(state, stmt) {
    const s = clone(state);
    const fail = note => ({ state, ok: false, note });
    const needP = () => (s.p === null ? "p를 아직 초기화하지 않았다. 어디를 가리키는지 모르는 포인터다. Visual Studio는 이런 코드에 C4700 경고를 내고(SDL 검사를 켜면 오류), 실행하면 0xC0000005로 멈출 수 있다." : null);
    switch (stmt) {
      case "p = &a;": s.p = { obj: "a", idx: 0 }; return { state: s, ok: true, note: `p에 a의 주소(${hex(0x1000)})를 넣었다. 이제 *p는 a다.` };
      case "p = &b;": s.p = { obj: "b", idx: 0 }; return { state: s, ok: true, note: `p에 b의 주소(${hex(0x1004)})를 넣었다. 이제 *p는 b다.` };
      case "p = arr;": s.p = { obj: "arr", idx: 0 }; return { state: s, ok: true, note: `배열 이름을 식에 쓰면 첫 칸의 주소가 된다(sizeof 안은 예외). p = &arr[0]과 같다. p는 ${hex(0x1008)}.` };
      case "p = p + 1;":
      case "p = p - 1;": {
        const bad = needP(); if (bad) return fail(bad);
        const d = stmt.includes("+") ? 1 : -1;
        s.p = { obj: s.p.obj, idx: s.p.idx + d };
        const w = where(s.p), before = where(state.p);
        let note = `p가 ${hex(before.addr)}에서 ${hex(w.addr)}${ro(hex(w.addr))}, ${d > 0 ? "높은" : "낮은"} 주소 쪽으로 4바이트 움직였다. 1이 아니라 int 하나의 크기만큼이다.`;
        if (w.inside) note += ` 이제 *p는 ${w.name}이다.`;
        else if (w.onePast && w.obj.len > 1) note += ` 배열의 끝 바로 다음이다. 가리키기만 할 수 있고, *p로 읽거나 쓰면 정의되지 않은 동작이다.`;
        else note += ` ${w.obj.name}${w.obj.len > 1 ? " 배열" : ""} 밖이다. 그 자리에 무엇이 있는지는 컴파일러가 정하므로, *p로 읽거나 쓰면 정의되지 않은 동작이다.`;
        return { state: s, ok: true, note };
      }
      case "*p = *p + 100;":
      case "*p = 0;":
      case "printf(\"%d\\n\", *p);": {
        const bad = needP(); if (bad) return fail(bad);
        const w = where(s.p);
        if (!w.inside) return fail(`p는 ${hex(w.addr)}, 곧 ${w.obj.name}${w.obj.len > 1 ? " 배열" : ""} 밖을 가리킨다. 여기를 읽거나 쓰는 것은 정의되지 않은 동작이라 이 실험실은 실행하지 않는다. 실제 프로그램에서는 다른 변수를 망가뜨리거나 멈출 수 있다.`);
        if (stmt.startsWith("*p")) {
          s.vals[w.obj.name][s.p.idx] = stmt === "*p = 0;" ? 0 : s.vals[w.obj.name][s.p.idx] + 100;
          const before = state.vals[w.obj.name][s.p.idx], after = s.vals[w.obj.name][s.p.idx];
          return { state: s, ok: true, note: `*p는 곧 ${w.name}${plain(w.name) ? "라서" : "이라서"} ${w.name}${iga(w.name)} ${before}에서 ${after}${ro(after)} 바뀌었다. p 자신은 그대로다.` };
        }
        s.out += `${s.vals[w.obj.name][s.p.idx]}\n`;
        const v = s.vals[w.obj.name][s.p.idx];
        return { state: s, ok: true, note: `*p, 곧 ${w.name}의 값 ${v}${eul(v)} 출력했다.` };
      }
      case "a = 0;":
        s.vals.a[0] = 0;
        return { state: s, ok: true, note: "a를 바꿨다." + (s.p && s.p.obj === "a" && s.p.idx === 0 ? " p가 a를 가리키고 있으니 *p도 0이다. 같은 칸을 두 이름으로 부르는 것이다." : "") };
      default:
        return fail(`모르는 문장: ${stmt}`);
    }
  }

  // 문장 목록을 차례로 실행한다 (테스트용)
  function run(stmts) {
    let st = initial();
    const notes = [];
    for (const x of stmts) {
      const r = exec(st, x);
      notes.push(r.ok);
      st = r.state;
    }
    return { state: st, oks: notes };
  }

  return { OBJECTS, P_ADDR, STMTS, initial, exec, run, where, hex, iga, eul, ro };
})();
// ==== 계산 로직 끝 ====

// ---- 강의 사이트 안에 들어갔을 때: 테마와 높이 맞추기 ----
(() => {
  const media = matchMedia("(prefers-color-scheme: dark)");
  let parentBody = null;
  try { if (window.parent !== window) parentBody = window.parent.document.body; } catch { parentBody = null; }
  const sync = () => {
    let dark = media.matches;
    const scheme = parentBody && parentBody.getAttribute("data-md-color-scheme");
    if (scheme) dark = scheme === "slate";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  };
  sync();
  media.addEventListener("change", sync);
  if (parentBody) new MutationObserver(sync).observe(parentBody, { attributes: true, attributeFilter: ["data-md-color-scheme"] });

  // 문서 전체가 아니라 내용(body) 높이로 맞춘다. 그래야 내용이 줄 때 iframe도 줄어든다.
  const fit = () => {
    try {
      if (window.frameElement) window.frameElement.style.height = `${Math.ceil(document.body.getBoundingClientRect().height)}px`;
    } catch { /* 다른 출처에서 열린 경우 */ }
  };
  new ResizeObserver(fit).observe(document.body);
})();

// ---- 화면 ----
(() => {
  const L = PointerLogic;
  const $ = id => document.getElementById(id);
  let state = L.initial(), prev = null, log = [];

  for (const stmt of [...L.STMTS, "처음으로"]) {
    const b = document.createElement("button");
    b.className = "btn" + (stmt === "처음으로" ? "" : " code");
    b.textContent = stmt;
    b.addEventListener("click", () => {
      if (stmt === "처음으로") { state = L.initial(); prev = null; log = []; render(null); return; }
      const r = L.exec(state, stmt);
      prev = state;
      state = r.state;
      log.push({ stmt, ok: r.ok });
      render(r);
    });
    $("palette").append(b);
  }

  function render(r) {
    const tb = $("mem");
    tb.textContent = "";
    const w = state.p ? L.where(state.p) : null;
    const rows = [];
    for (const o of L.OBJECTS)
      for (let i = 0; i < o.len; i++) rows.push({ addr: o.addr + i * 4, name: o.len > 1 ? `${o.name}[${i}]` : o.name, val: state.vals[o.name][i], old: prev ? prev.vals[o.name][i] : null });
    rows.push({ addr: 0x1014, name: "", val: "", old: null, gap: true });
    rows.push({ addr: L.P_ADDR, name: "p", val: state.p ? L.hex(w.addr) : "? (초기화 안 함)", old: prev ? (prev.p ? L.hex(L.where(prev.p).addr) : "? (초기화 안 함)") : null });
    for (const row of rows) {
      const tr = document.createElement("tr");
      const hit = w && w.addr === row.addr && row.name !== "p";
      if (hit) tr.className = w.inside ? "target" : "outside";
      tr.innerHTML = `<td class="arrow">${hit ? (w.inside ? "*p →" : "p →") : ""}</td><td class="mono">${L.hex(row.addr)}</td><td class="mono">${row.gap ? "" : row.name}</td><td class="mono val${row.old !== null && String(row.old) !== String(row.val) ? " changed" : ""}">${row.gap ? "<span style=\"color:var(--muted)\">(빈 자리)</span>" : row.val}</td>`;
      tb.append(tr);
    }
    if (w && !w.inside && !rows.some(rw => rw.addr === w.addr)) {
      const tr = document.createElement("tr");
      tr.className = "outside";
      tr.innerHTML = `<td class="arrow">p →</td><td class="mono">${L.hex(w.addr)}</td><td class="mono"></td><td class="mono">(아무것도 정해지지 않은 곳)</td>`;
      if (w.addr < 0x1000) tb.prepend(tr); else tb.append(tr);
    }
    const lines = ["int a = 5, b = 8;", "int arr[3] = {10, 20, 30};", "int *p;", ...log.map(x => (x.ok ? x.stmt : `${x.stmt}   ← 실행 안 함`))];
    $("log").textContent = lines.join("\n") + (state.out ? `\n\n출력:\n${state.out}` : "");
    $("note").textContent = r ? r.note : "문장 버튼을 눌러 본다. 처음에는 p를 초기화하지 않았다.";
    $("note").className = "note" + (r && !r.ok ? " bad" : "");
  }
  render(null);
})();
</script>
</body>
</html>
