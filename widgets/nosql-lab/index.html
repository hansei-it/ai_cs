<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>같은 주문, 네 가지 모델</title>
<meta name="description" content="같은 주문 6건을 표, 키-값, 문서, 와이드 컬럼으로 저장해 두고, 질의를 골라 모델마다 몇 개를 읽고 고치는지, 전체를 훑는지 견준다">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2329;
    --muted: #5f6670;
    --line: #d9dde3;
    --soft: #f3f5f8;
    --accent: #3f51b5;
    --accent-bg: #e8ebfa;
    --read: #1971c2;
    --read-bg: #e7f1fb;
    --ok: #2b8a3e;
    --ok-bg: #e6f4ea;
    --write: #c2410c;
    --write-bg: #fdf0e3;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1e2129;
    --fg: #e2e4e9;
    --muted: #9aa0aa;
    --line: #3a3f4b;
    --soft: #262a33;
    --accent: #8c9eff;
    --accent-bg: #2b3156;
    --read: #74c0fc;
    --read-bg: #1d3247;
    --ok: #69db7c;
    --ok-bg: #1f3a27;
    --write: #ffa94d;
    --write-bg: #3d2a17;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    padding: 14px 16px 16px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    word-break: keep-all;
  }
  .mono { font-family: "JetBrains Mono", Consolas, "D2Coding", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", monospace; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .lead { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 10px; }
  .row > .label { color: var(--muted); font-size: 14px; min-width: 3em; }
  .btn {
    font: inherit; font-size: 13px; color: var(--fg); background: var(--soft); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 9px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .card { border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; background: var(--soft); font-size: 13px; }
  .card.best { border-color: var(--ok); background: var(--ok-bg); }
  .card.scan { border-color: var(--write); background: var(--write-bg); }
  .card h2 { font-size: 13.5px; margin: 0 0 3px; }
  .card .shape { color: var(--muted); font-size: 11.5px; min-height: 2.6em; }
  .card .num { font-size: 20px; font-weight: 700; font-family: "JetBrains Mono", Consolas, "Malgun Gothic", monospace; }
  .card .tag { font-size: 12px; font-weight: 700; }
  .card.scan .tag { color: var(--write); }
  .card.best .tag { color: var(--ok); }
  .res { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .note { margin: 10px 0 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--soft); font-size: 14px; min-height: 2.6em; }
  @media (max-width: 480px) { body { padding: 10px; font-size: 14px; } }
</style>
</head>
<body>
<h1>같은 주문, 네 가지 모델</h1>
<p class="lead">고객 셋이 주문 6건을 했다. 같은 데이터를 네 모델로 저장해 두고, 질의를 골라 모델마다 몇 개를 읽고 고치는지 센다. 상품 이름은 표만 따로 두고, 나머지 셋은 주문 안에 복사해 두었다.</p>
<div class="row" role="group" aria-label="질의">
  <span class="label">질의</span>
  <button class="btn" data-q="one">주문 o4 하나 보기</button>
  <button class="btn" data-q="list">김하나의 주문 목록</button>
  <button class="btn" data-q="rename">상품 502 이름 바꾸기</button>
  <button class="btn" data-q="sum">상품별 판매 수량</button>
</div>
<div class="cards" id="cards"></div>
<div class="res" id="res"></div>
<p class="note" id="note" aria-live="polite"></p>

<script>
// ==== 계산 로직 (화면과 분리: tests에서 그대로 불러 검증한다) ====
const NoSqlLogic = (() => {
  const CUST = { 1: "김하나", 2: "이두리", 3: "박세나" };
  const PROD = { 501: "키보드", 502: "마우스", 503: "모니터" };
  const ORD = [["o1", 1, 501, 1, "10-01"], ["o2", 1, 502, 2, "10-01"], ["o3", 2, 501, 1, "10-02"],
    ["o4", 3, 503, 1, "10-03"], ["o5", 1, 503, 1, "10-04"], ["o6", 2, 502, 1, "10-05"]];   // 주문, 고객, 상품, 수량, 날짜
  // 네 모델로 저장한다
  function stores() {
    const table = { order: Object.fromEntries(ORD.map(([o, c, p, q, d]) => [o, { c, p, q, d }])) };
    const kv = {};
    for (const [o, c, p, q, d] of ORD) kv[`order:${o}`] = { customer: c, product: PROD[p], product_id: p, qty: q, date: d };
    for (const c of Object.keys(CUST)) kv[`customer:${c}:orders`] = ORD.filter(r => r[1] === Number(c)).map(r => r[0]);
    const doc = Object.keys(CUST).map(c => ({ _id: Number(c), name: CUST[c],
      orders: ORD.filter(r => r[1] === Number(c)).map(([o, , p, q, d]) => ({ id: o, product: { id: p, name: PROD[p] }, qty: q, date: d })) }));
    // 와이드 컬럼: 고객이 파티션 키, 그 안은 (날짜, 주문) 큰 것부터 정렬
    const wide = {};
    for (const c of Object.keys(CUST)) wide[c] = ORD.filter(r => r[1] === Number(c)).map(([o, , p, q, d]) => [d, o, PROD[p], p, q])
      .sort((a, b) => (a[0] === b[0] ? (a[1] < b[1] ? 1 : -1) : a[0] < b[0] ? 1 : -1));
    return { table, kv, doc, wide };
  }
  const orderKeys = kv => Object.keys(kv).filter(k => k.startsWith("order:"));
  const allRows = wide => Object.values(wide).reduce((s, r) => s + r.length, 0);
  const sums = () => {
    const t = {};
    for (const [, , p, q] of ORD) t[PROD[p]] = (t[PROD[p]] || 0) + q;
    return Object.entries(t).sort((a, b) => (a[0] < b[0] ? -1 : 1));
  };
  // read: 읽은 단위 수(표는 행, 키-값은 키, 문서는 문서, 와이드 컬럼은 행), write: 고친 단위 수, scan: 전체를 훑었나
  // parts: 와이드 컬럼이 연 파티션 수(파티션 하나 안의 행은 붙어 있어 한 번에 읽는다)
  function run(q) {
    const { table, kv, doc, wide } = stores();
    if (q === "one") {
      const o = table.order.o4, v = kv["order:o4"];
      let dRead = 0, dRes = null;
      for (const d of doc) { dRead++; const h = d.orders.find(x => x.id === "o4"); if (h) { dRes = [d._id, h.product.name, h.qty]; break; } }
      let wRes = null;
      for (const [c, rows] of Object.entries(wide)) { const h = rows.find(r => r[1] === "o4"); if (h) wRes = [Number(c), h[2], h[4]]; }
      return {
        table: { read: 2, write: 0, scan: false, result: [o.c, PROD[o.p], o.q] },              // 주문 행 하나와 상품 행 하나
        kv: { read: 1, write: 0, scan: false, result: [v.customer, v.product, v.qty] },
        doc: { read: dRead, write: 0, scan: true, result: dRes },
        wide: { read: allRows(wide), write: 0, scan: true, result: wRes, parts: Object.keys(wide).length },
      };
    }
    if (q === "list") {
      const mine = Object.entries(table.order).filter(([, v]) => v.c === 1);
      const byDate = xs => xs.sort((a, b) => (a[0] === b[0] ? (a[1] < b[1] ? 1 : -1) : a[0] < b[0] ? 1 : -1)).map(x => x[1]);
      const ids = kv["customer:1:orders"];
      return {
        table: { read: mine.length * 2, write: 0, scan: false, result: byDate(mine.map(([o, v]) => [v.d, o])) },
        kv: { read: 1 + ids.length, write: 0, scan: false, result: byDate(ids.map(o => [kv[`order:${o}`].date, o])) },
        doc: { read: 1, write: 0, scan: false, result: byDate(doc.find(d => d._id === 1).orders.map(x => [x.date, x.id])) },
        wide: { read: wide[1].length, write: 0, scan: false, result: wide[1].map(r => r[1]), parts: 1 },
      };
    }
    if (q === "rename") {
      const kvHits = orderKeys(kv).filter(k => kv[k].product_id === 502).length;
      const dHits = doc.reduce((s, d) => s + d.orders.filter(x => x.product.id === 502).length, 0);
      const dDocs = doc.filter(d => d.orders.some(x => x.product.id === 502)).length;
      const wHits = Object.values(wide).reduce((s, rows) => s + rows.filter(r => r[3] === 502).length, 0);
      return {
        table: { read: 1, write: 1, scan: false, result: 1 },
        kv: { read: orderKeys(kv).length, write: kvHits, scan: true, result: kvHits },
        doc: { read: doc.length, write: dDocs, scan: true, result: dHits },
        wide: { read: allRows(wide), write: wHits, scan: true, result: wHits, parts: Object.keys(wide).length },
      };
    }
    const s = sums();
    return {
      table: { read: ORD.length + Object.keys(PROD).length, write: 0, scan: true, result: s },
      kv: { read: orderKeys(kv).length, write: 0, scan: true, result: s },
      doc: { read: doc.length, write: 0, scan: true, result: s },
      wide: { read: allRows(wide), write: 0, scan: true, result: s, parts: Object.keys(wide).length },
    };
  }
  return { CUST, PROD, ORD, stores, run };
})();
// ==== 계산 로직 끝 ====

// ---- 강의 사이트 안에 들어갔을 때: 테마와 높이 맞추기 ----
(() => {
  const media = matchMedia("(prefers-color-scheme: dark)");
  let parentBody = null;
  try { if (window.parent !== window) parentBody = window.parent.document.body; } catch { parentBody = null; }
  const sync = () => {
    let dark = media.matches;
    const scheme = parentBody && parentBody.getAttribute("data-md-color-scheme");
    if (scheme) dark = scheme === "slate";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  };
  sync();
  media.addEventListener("change", sync);
  if (parentBody) new MutationObserver(sync).observe(parentBody, { attributes: true, attributeFilter: ["data-md-color-scheme"] });

  // 문서 전체가 아니라 내용(body) 높이로 맞춘다. 그래야 내용이 줄 때 iframe도 줄어든다.
  const fit = () => {
    try {
      if (window.frameElement) window.frameElement.style.height = `${Math.ceil(document.body.getBoundingClientRect().height)}px`;
    } catch { /* 다른 출처에서 열린 경우 */ }
  };
  new ResizeObserver(fit).observe(document.body);
})();

// ---- 화면 ----
(() => {
  const L = NoSqlLogic;
  const $ = id => document.getElementById(id);
  const MODELS = [
    ["table", "표 (관계형)", "고객, 상품, 주문 표. 주문에는 상품 번호만", "행"],
    ["kv", "키-값", "order:o1 → 주문 하나, customer:1:orders → 주문 번호 목록", "키"],
    ["doc", "문서", "고객 문서 하나에 그 고객의 주문을 넣어 둔다", "문서"],
    ["wide", "와이드 컬럼", "고객이 파티션 키, 파티션 안은 날짜 차례", "행"],
  ];
  const NOTE = {
    one: "주문 번호를 키로 둔 키-값은 키 하나만 읽는다. 문서와 와이드 컬럼은 주문을 고객 아래에 두었기 때문에, 고객을 모르면 전체를 연다. 여기서는 인덱스 없이 세었다. 문서 DB는 문서 안의 orders.id에 인덱스를 두면 바로 찾는다.",
    list: "고객 단위로 모아 둔 문서와 와이드 컬럼은 한 번에 읽는다. 문서는 하나, 와이드 컬럼은 파티션 하나(그 안의 3행은 붙어 있고 이미 날짜 차례다)다. 키-값은 목록 키를 따로 만들어 두었기에 이만큼으로 된다.",
    rename: "상품 이름을 주문마다 복사해 둔 모델은 그 이름이 든 곳을 모두 찾아 고쳐야 한다. 표는 상품 표의 한 행만 고친다. 하나라도 빠뜨리면 이름이 서로 다르다([[51]]의 수정 이상).",
    sum: "모두를 묶어 세는 질의는 어느 모델이든 전체를 읽는다. 이런 질의가 잦으면 결과를 따로 저장해 두거나, 그 질의에 맞춘 표를 하나 더 만든다.",
  };
  let q = "list";
  function render() {
    const r = L.run(q);
    // 와이드 컬럼은 파티션 하나 안의 행을 한 번에 읽으므로, 견줄 때는 연 파티션 수로 센다
    const cost = (m, x) => (m === "wide" ? x.parts : x.read) + x.write;
    const min = Math.min(...MODELS.map(([m]) => cost(m, r[m])));
    $("cards").innerHTML = MODELS.map(([m, name, shape, unit]) => {
      const x = r[m], best = !x.scan && cost(m, x) === min;
      return `<div class="card ${x.scan ? "scan" : best ? "best" : ""}"><h2>${name}</h2><div class="shape">${shape}</div>`
        + `<div><span class="num">${x.read}</span> ${unit} 읽기${m === "wide" ? ` (파티션 ${x.parts}개)` : ""}${x.write ? `, <b>${x.write}</b> ${unit} 고치기` : ""}</div>`
        + `<div class="tag">${x.scan ? "전체를 훑었다" : best ? (x.write ? "가장 적게 읽고 고쳤다" : "가장 적게 읽었다") : ""}</div></div>`;
    }).join("");
    const res = r.table.result;
    const RES = {
      one: () => `결과(네 모델이 같다): <span class="mono">고객 ${res[0]}, ${res[1]} ${res[2]}개</span>`,
      list: () => `결과(네 모델이 같다): <span class="mono">${res.join(", ")}</span> (최근 주문부터)`,
      rename: () => `상품 502의 이름이 바뀐다. 고친 곳: 표 ${r.table.write}행, 키-값 ${r.kv.write}키, 문서 ${r.doc.write}개, 와이드 컬럼 ${r.wide.write}행`,
      sum: () => `결과(네 모델이 같다): <span class="mono">${res.map(([k, v]) => `${k} ${v}`).join(", ")}</span>`,
    };
    $("res").innerHTML = RES[q]();
    $("note").textContent = NOTE[q].replace("[[51]]", "51번");
    document.querySelectorAll("[data-q]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.q === q)));
  }
  document.querySelectorAll("[data-q]").forEach(b => b.addEventListener("click", () => { q = b.dataset.q; render(); }));
  const p = new URLSearchParams(location.search).get("q");
  if (["one", "list", "rename", "sum"].includes(p)) q = p;
  render();
})();
</script>
</body>
</html>
