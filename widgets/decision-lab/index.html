<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가중치가 바꾸는 결정</title>
<meta name="description" content="쿠폰 표를 어디에 둘지 세 대안을 네 기준으로 견주는 결정표에서, 상황을 고르거나 기준의 가중치를 바꿔 결론이 언제 뒤집히는지 본다">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2329;
    --muted: #5f6670;
    --line: #d9dde3;
    --soft: #f3f5f8;
    --accent: #3f51b5;
    --accent-bg: #e8ebfa;
    --read: #1971c2;
    --read-bg: #e7f1fb;
    --write: #c2410c;
    --write-bg: #fdf0e3;
    --good: #2b8a3e;
    --good-bg: #e6f4ea;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1e2129;
    --fg: #e2e4e9;
    --muted: #9aa0aa;
    --line: #3a3f4b;
    --soft: #262a33;
    --accent: #8c9eff;
    --accent-bg: #2b3156;
    --read: #74c0fc;
    --read-bg: #1d3247;
    --write: #ffa94d;
    --write-bg: #3d2a17;
    --good: #69db7c;
    --good-bg: #1f3326;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    padding: 14px 16px 16px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    word-break: keep-all;
  }
  .mono { font-family: "JetBrains Mono", Consolas, "D2Coding", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", monospace; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .lead { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 8px; }
  .row > .label { color: var(--muted); font-size: 14px; min-width: 4.5em; }
  .btn {
    font: inherit; font-size: 13px; color: var(--fg); background: var(--soft); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 9px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .btn.go { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=range] { accent-color: var(--accent); }
  .warn { color: var(--write); font-weight: 700; }
  .fine { color: var(--good); font-weight: 700; }
  .note { margin: 10px 0 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--soft); font-size: 14px; min-height: 2.6em; }
  .sit { margin: 0 0 8px; font-size: 13px; color: var(--muted); min-height: 1.4em; }
  .alts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; margin-bottom: 6px; }
  .alts b { font-family: "JetBrains Mono", Consolas, "D2Coding", "Malgun Gothic", monospace; }
  .crit { display: grid; gap: 6px; }
  .c { border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; }
  .c .top { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 12px; align-items: center; }
  .c .nm { font-size: 14px; font-weight: 700; }
  .c .w { display: flex; align-items: center; gap: 4px; font-size: 13px; }
  .c .w .btn { padding: 0 8px; }
  .c .w b { display: inline-block; min-width: 1.2em; text-align: center; font-size: 16px; }
  .c .sc { display: flex; gap: 4px; font-size: 13px; }
  .c .sc span { display: inline-block; min-width: 2.6em; text-align: center; border-radius: 4px; background: var(--soft); padding: 0 4px; }
  .c .why { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
  .strip { display: flex; align-items: center; gap: 3px; margin-top: 4px; font-size: 11px; color: var(--muted); }
  .strip i { font-style: normal; display: inline-block; min-width: 2.7em; text-align: center; border-radius: 3px; padding: 0 2px; border: 1px solid transparent; font-family: "JetBrains Mono", Consolas, "D2Coding", "Malgun Gothic", monospace; }
  .strip i.cur { border-color: var(--fg); font-weight: 700; }
  .wA { background: var(--accent-bg); color: var(--accent); }
  .wB { background: var(--read-bg); color: var(--read); }
  .wC { background: var(--write-bg); color: var(--write); }
  .wT { background: var(--soft); color: var(--fg); }
  .tot { display: grid; gap: 4px; margin-top: 10px; }
  .tot .r { display: grid; grid-template-columns: 1.6em minmax(0, 1fr) 3em; gap: 8px; align-items: center; font-size: 14px; }
  .tot .bar { display: block; height: 16px; border-radius: 3px; }
  .tot .bar.wA { background: var(--accent); }
  .tot .bar.wB { background: var(--read); }
  .tot .bar.wC { background: var(--write); }
  .tot .r.win { font-weight: 700; }
  .tot .r.win .bar { outline: 2px solid var(--fg); outline-offset: 1px; }
  @media (max-width: 480px) { body { padding: 10px; font-size: 14px; } .c .top { grid-template-columns: minmax(0, 1fr) auto; } .c .sc { grid-column: 1 / -1; } }
</style>
</head>
<body>
<h1>가중치가 바꾸는 결정</h1>
<p class="lead">점수(1~5)는 82번의 쿠폰 결정에서 팀이 근거와 함께 매긴 값이고, 가중치(0~5)는 지금 상황에서 그 기준이 얼마나 중요한지다. 합계는 기준마다 가중치 × 점수를 더한 값이다.</p>
<div class="row" role="group" aria-label="상황">
  <span class="label">상황</span>
  <button class="btn" data-p="now">석 달에 한 번 바꾼다</button>
  <button class="btn" data-p="monthly">한 달에 세 번 이상</button>
  <button class="btn" data-p="weekly">매주, 마케팅팀이 직접</button>
</div>
<p class="sit" id="sit"></p>
<div class="alts" id="alts"></div>
<div class="crit" id="crit"></div>
<div class="tot" id="tot"></div>
<p class="note" id="note" aria-live="polite"></p>

<script>
// ==== 계산 로직 (화면과 분리: tests에서 그대로 불러 검증한다) ====
const DecisionLogic = (() => {
  // 82번의 결정: 쿠폰 표(쿠폰 → 할인율)를 어디에 둘까. 점수는 1~5(클수록 좋다), 가중치는 0~5다.
  const ALTS = [
    { id: "A", name: "코드 안의 사전" },
    { id: "B", name: "JSON 설정 파일" },
    { id: "C", name: "DB 표와 관리 화면" },
  ];
  const CRITERIA = [
    { name: "개발자 없이 바로 바꾸기", scores: [1, 3, 5],
      why: "A는 코드를 고쳐 배포해야 한다. B는 설정 파일만 고쳐 다시 읽는다. C는 관리 화면에서 바로 바꾼다." },
    { name: "실수를 미리 잡기", scores: [5, 4, 2],
      why: "A는 리뷰, 테스트, CI를 거친다. B도 리뷰와 형식 검사를 거친다. C는 입력 화면의 검사뿐이다." },
    { name: "만들고 운영하기 가벼움", scores: [5, 4, 2],
      why: "A는 이미 있다. B는 파일을 읽는 코드 몇 줄이다. C는 표, 화면, 권한, 백업이 는다." },
    { name: "바뀐 기록 남기기", scores: [5, 5, 3],
      why: "A와 B는 누가 언제 왜 바꿨는지 git에 남는다. C는 기록 표를 따로 만들어야 한다." },
  ];
  const PRESETS = {
    now: { w: [1, 3, 2, 2], text: "쿠폰은 WELCOME10 하나이고, 석 달에 한 번쯤 개발자가 바꾼다." },
    monthly: { w: [3, 3, 2, 2], text: "쿠폰이 늘어 한 달에 세 번 이상 바꾼다. 바꿀 때마다 배포를 기다린다." },
    weekly: { w: [5, 2, 1, 1], text: "마케팅팀이 주말 쿠폰을 매주 금요일 저녁에 직접 바꾸고 싶어 한다." },
  };
  const totals = w => ALTS.map((_, a) => CRITERIA.reduce((s, c, i) => s + w[i] * c.scores[a], 0));
  function winners(w) {                          // 합계가 가장 큰 대안들(동점이면 여럿)
    const t = totals(w);
    const m = Math.max(...t);
    return ALTS.filter((_, a) => t[a] === m).map(x => x.id);
  }
  const label = ws => ws.join("=");
  function strip(w, i) {                         // 기준 i의 가중치만 0~5로 바꿀 때 이기는 대안
    return [0, 1, 2, 3, 4, 5].map(k => label(winners(w.map((x, j) => (j === i ? k : x)))));
  }
  function nearestFlip(w) {                      // 가중치 하나만 바꿔 결론이 달라지는 가장 가까운 곳
    const now = label(winners(w));
    let best = null;
    CRITERIA.forEach((_, i) => {
      strip(w, i).forEach((to, k) => {
        if (to === now) return;
        const d = Math.abs(k - w[i]);
        if (!best || d < best.d || (d === best.d && i < best.i)) best = { i, k, to, d };
      });
    });
    return best;
  }
  function margin(w) {                           // 1등과 2등의 점수 차(동점이면 0)
    const t = [...totals(w)].sort((a, b) => b - a);
    return t[0] - t[1];
  }
  return { ALTS, CRITERIA, PRESETS, totals, winners, label, strip, nearestFlip, margin };
})();
// ==== 계산 로직 끝 ====

// ---- 강의 사이트 안에 들어갔을 때: 테마와 높이 맞추기 ----
(() => {
  const media = matchMedia("(prefers-color-scheme: dark)");
  let parentBody = null;
  try { if (window.parent !== window) parentBody = window.parent.document.body; } catch { parentBody = null; }
  const sync = () => {
    let dark = media.matches;
    const scheme = parentBody && parentBody.getAttribute("data-md-color-scheme");
    if (scheme) dark = scheme === "slate";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  };
  sync();
  media.addEventListener("change", sync);
  if (parentBody) new MutationObserver(sync).observe(parentBody, { attributes: true, attributeFilter: ["data-md-color-scheme"] });

  // 문서 전체가 아니라 내용(body) 높이로 맞춘다. 그래야 내용이 줄 때 iframe도 줄어든다.
  const fit = () => {
    try {
      if (window.frameElement) window.frameElement.style.height = `${Math.ceil(document.body.getBoundingClientRect().height)}px`;
    } catch { /* 다른 출처에서 열린 경우 */ }
  };
  new ResizeObserver(fit).observe(document.body);
})();

// ---- 화면 ----
(() => {
  const L = DecisionLogic;
  const $ = id => document.getElementById(id);
  const cls = lab => (lab.includes("=") ? "wT" : `w${lab}`);
  let preset = "now";
  let w = [...L.PRESETS.now.w];
  const fromQuery = new URLSearchParams(location.search).get("preset");
  if (fromQuery && L.PRESETS[fromQuery]) { preset = fromQuery; w = [...L.PRESETS[fromQuery].w]; }
  $("alts").innerHTML = L.ALTS.map(a => `<span><b class="${cls(a.id)}">&nbsp;${a.id}&nbsp;</b> ${a.name}</span>`).join("");
  function render() {
    $("sit").textContent = preset ? L.PRESETS[preset].text : "가중치를 직접 바꿨다. 지금 상황에서 각 기준이 얼마나 중요한지 생각하며 맞춘다.";
    $("crit").innerHTML = L.CRITERIA.map((c, i) => {
      const st = L.strip(w, i);
      return `<div class="c">
        <div class="top"><span class="nm">${c.name}</span>
          <span class="w">가중치 <button class="btn" data-i="${i}" data-d="-1" aria-label="${c.name} 가중치 낮추기"${w[i] === 0 ? " disabled" : ""}>−</button><b class="mono">${w[i]}</b><button class="btn" data-i="${i}" data-d="1" aria-label="${c.name} 가중치 높이기"${w[i] === 5 ? " disabled" : ""}>+</button></span>
          <span class="sc">${c.scores.map((s, a) => `<span class="${cls(L.ALTS[a].id)}">${L.ALTS[a].id} ${s}</span>`).join("")}</span></div>
        <p class="why">${c.why}</p>
        <div class="strip">가중치 0~5일 때 이기는 쪽 ${st.map((lab, k) => `<i class="${cls(lab)}${k === w[i] ? " cur" : ""}">${lab}</i>`).join("")}</div>
      </div>`;
    }).join("");
    document.querySelectorAll("[data-i]").forEach(b => b.addEventListener("click", () => {
      const i = Number(b.dataset.i);
      w[i] = Math.min(5, Math.max(0, w[i] + Number(b.dataset.d)));
      preset = Object.keys(L.PRESETS).find(k => L.PRESETS[k].w.every((x, j) => x === w[j])) ?? null;
      render();
    }));
    const t = L.totals(w);
    const win = L.winners(w);
    $("tot").innerHTML = L.ALTS.map((a, k) => `<div class="r${win.includes(a.id) ? " win" : ""}"><span class="mono">${a.id}</span>`
      + `<span class="bar ${cls(a.id)}" style="width:${Math.max(t[k], 0.5)}%"></span><span class="mono">${t[k]}점</span></div>`).join("");
    let note;
    if (win.length > 1) note = `${win.join("와 ")}가 동점이다. 점수표만으로는 정할 수 없다. 기준을 더 나누거나, 누가 무엇을 근거로 정했는지 적는다.`;
    else {
      const order = L.ALTS.map((a, k) => [a.id, t[k]]).sort((x, y) => y[1] - x[1]);
      const f = L.nearestFlip(w);
      note = `${order[0][0]}(${order[0][1]}점)가 ${order[1][0]}(${order[1][1]}점)를 ${L.margin(w)}점 앞선다.`;
      if (f) note += ` '${L.CRITERIA[f.i].name}'의 가중치를 ${f.k}${f.k === 0 || f.k === 3 ? "으로" : "로"} 바꾸면 ${f.to.includes("=") ? `${f.to.split("=").join("와 ")}가 동점이 된다` : `${f.to}가 이긴다`}.`;
      if (f && f.d <= 2) note += " 결론이 이 가중치에 기대고 있으니, 그 가중치를 정한 상황을 ADR의 다시 볼 조건으로 적는다.";
    }
    $("note").textContent = note;
    document.querySelectorAll("[data-p]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.p === preset)));
  }
  document.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => { preset = b.dataset.p; w = [...L.PRESETS[preset].w]; render(); }));
  render();
})();
</script>
</body>
</html>
