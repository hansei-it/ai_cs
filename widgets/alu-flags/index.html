<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8비트 덧셈기와 상태 표시</title>
<meta name="description" content="두 수를 바꾸거나 예시를 눌러, 8비트 덧셈의 결과와 캐리·오버플로·0·음수 표시가 어떻게 켜지는지 본다">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2329;
    --muted: #5f6670;
    --line: #d9dde3;
    --soft: #f3f5f8;
    --accent: #3f51b5;
    --accent-fg: #ffffff;
    --on: #c2410c;
    --on-bg: #fdf0e3;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1e2129;
    --fg: #e2e4e9;
    --muted: #9aa0aa;
    --line: #3a3f4b;
    --soft: #262a33;
    --accent: #8c9eff;
    --accent-fg: #11131a;
    --on: #ffa94d;
    --on-bg: #3d2c18;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    padding: 14px 16px 16px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    word-break: keep-all;
  }
  .mono, input.mono { font-family: "JetBrains Mono", Consolas, "D2Coding", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", monospace; }
  h1 { font-size: 16px; margin: 0 0 10px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 12px; }
  .row > .label { color: var(--muted); font-size: 14px; }
  .btn {
    font: inherit; font-size: 13px; color: var(--fg); background: var(--soft); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 8px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .sum { display: grid; grid-template-columns: auto auto 1fr auto; gap: 6px 10px; align-items: center; max-width: 560px; }
  .sum .op { font-size: 20px; font-weight: 700; text-align: center; }
  .sum .line { grid-column: 1 / -1; border-top: 2px solid var(--fg); margin: 2px 0; }
  .sum input[type="number"] {
    font: inherit; color: var(--fg); background: var(--soft); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 6px; width: 4.6em;
  }
  .bits { font-size: 18px; letter-spacing: 1px; white-space: pre; }
  .bits .carry { color: var(--on); font-weight: 700; }
  .signed { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .result { font-weight: 700; }
  #r { padding-left: 7px; }

  .lamps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 14px 0 6px; max-width: 560px; }
  .lamp { border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--soft); }
  .lamp .name { font-weight: 700; font-size: 15px; }
  .lamp .desc { color: var(--muted); font-size: 12px; line-height: 1.35; }
  .lamp .state { font-size: 13px; color: var(--muted); }
  .lamp.on { border-color: var(--on); background: var(--on-bg); }
  .lamp.on .name, .lamp.on .state { color: var(--on); }
  .invalid .sum .bits, .invalid .sum .result, .invalid .sum .signed, .invalid .lamps { opacity: 0.35; }
  .note { margin: 10px 0 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--soft); font-size: 14px; }
  @media (max-width: 480px) {
    body { padding: 10px; font-size: 14px; }
    .lamps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .bits { font-size: 15px; }
    .sum { grid-template-columns: auto auto 1fr; }
    .sum .signed { grid-column: 2 / -1; }
  }
</style>
</head>
<body>
<h1>8비트 덧셈기와 상태 표시</h1>

<div class="row" role="group" aria-label="예시">
  <span class="label">예시</span>
  <button class="btn" data-a="255" data-b="1">255 + 1</button>
  <button class="btn" data-a="127" data-b="1">127 + 1</button>
  <button class="btn" data-a="200" data-b="100">200 + 100</button>
  <button class="btn" data-a="100" data-b="100">100 + 100</button>
  <button class="btn" data-a="128" data-b="128">128 + 128</button>
  <button class="btn" data-a="3" data-b="5">3 + 5</button>
</div>

<div class="sum">
  <span></span>
  <input id="a" type="number" class="mono" min="0" max="255" value="255" aria-label="첫째 수 (0~255)">
  <span class="bits mono" id="a-bits"></span>
  <span class="signed" id="a-signed"></span>
  <span class="op">+</span>
  <input id="b" type="number" class="mono" min="0" max="255" value="1" aria-label="둘째 수 (0~255)">
  <span class="bits mono" id="b-bits"></span>
  <span class="signed" id="b-signed"></span>
  <span class="line"></span>
  <span></span>
  <span class="result mono" id="r"></span>
  <span class="bits mono result" id="r-bits"></span>
  <span class="signed" id="r-signed"></span>
</div>

<div class="lamps" aria-live="polite">
  <div class="lamp" id="lamp-c"><div class="name">C 캐리</div><div class="state"></div><div class="desc">부호 없는 수로 0~255를 넘었다</div></div>
  <div class="lamp" id="lamp-v"><div class="name">V 오버플로</div><div class="state"></div><div class="desc">부호 있는 수로 −128~127을 넘었다</div></div>
  <div class="lamp" id="lamp-z"><div class="name">Z 0</div><div class="state"></div><div class="desc">결과가 0이다</div></div>
  <div class="lamp" id="lamp-n"><div class="name">N 음수</div><div class="state"></div><div class="desc">결과의 맨 앞 비트가 1이다</div></div>
</div>
<p class="note" id="note"></p>

<script>
// ==== 계산 로직 (화면과 분리: tests에서 그대로 불러 검증한다) ====
const AluLogic = (() => {
  const signed = v => (v >= 128 ? v - 256 : v);
  const bits = v => v.toString(2).padStart(8, "0").replace(/(.{4})/, "$1 ");

  // 8비트 덧셈: 결과와 네 표시 (x86-64의 CF, OF, ZF, SF와 같은 뜻)
  function add8(a, b) {
    const sum = a + b;
    const r = sum % 256;
    const ss = signed(a) + signed(b);
    return {
      r,
      carryOut: sum > 255,                 // 9번째 비트로 넘친 1
      C: sum > 255 ? 1 : 0,
      V: ss < -128 || ss > 127 ? 1 : 0,
      Z: r === 0 ? 1 : 0,
      N: r >= 128 ? 1 : 0,
      sa: signed(a), sb: signed(b), sr: signed(r), sum, ss,
    };
  }

  // 0~255 정수로 읽기. 범위를 벗어나거나 정수가 아니면 null
  function parse(text) {
    const t = String(text).trim();
    if (!/^\d{1,3}$/.test(t)) return null;
    const v = Number(t);
    return v <= 255 ? v : null;
  }

  return { signed, bits, add8, parse };
})();
// ==== 계산 로직 끝 ====

// ---- 강의 사이트 안에 들어갔을 때: 테마와 높이 맞추기 ----
(() => {
  const media = matchMedia("(prefers-color-scheme: dark)");
  let parentBody = null;
  try { if (window.parent !== window) parentBody = window.parent.document.body; } catch { parentBody = null; }
  const sync = () => {
    let dark = media.matches;
    const scheme = parentBody && parentBody.getAttribute("data-md-color-scheme");
    if (scheme) dark = scheme === "slate";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  };
  sync();
  media.addEventListener("change", sync);
  if (parentBody) new MutationObserver(sync).observe(parentBody, { attributes: true, attributeFilter: ["data-md-color-scheme"] });

  // 문서 전체가 아니라 내용(body) 높이로 맞춘다. 그래야 내용이 줄 때 iframe도 줄어든다.
  const fit = () => {
    try {
      if (window.frameElement) window.frameElement.style.height = `${Math.ceil(document.body.getBoundingClientRect().height)}px`;
    } catch { /* 다른 출처에서 열린 경우 */ }
  };
  new ResizeObserver(fit).observe(document.body);
})();

// ---- 화면 ----
(() => {
  const L = AluLogic;
  const $ = id => document.getElementById(id);
  const num = v => (v < 0 ? `−${-v}` : String(v));
  // 숫자를 읽은 소리의 끝에 받침이 없으면(2 이, 4 사, 5 오, 9 구) "가", 있으면 "이"
  const iga = v => ("2459".includes(String(Math.abs(v)).slice(-1)) ? "가" : "이");

  function render() {
    const a = L.parse($("a").value), b = L.parse($("b").value);
    document.body.classList.toggle("invalid", a === null || b === null);
    if (a === null || b === null) { $("note").textContent = "0~255 사이의 정수를 넣는다."; return; }
    const x = L.add8(a, b);
    $("a-bits").textContent = "  " + L.bits(a);
    $("b-bits").textContent = "  " + L.bits(b);
    $("a-signed").textContent = `부호 있는 수로 ${num(x.sa)}`;
    $("b-signed").textContent = `부호 있는 수로 ${num(x.sb)}`;
    $("r").textContent = String(x.r);
    $("r-bits").innerHTML = (x.carryOut ? '<span class="carry" title="9번째 비트로 넘친 1">1</span> ' : "  ") + L.bits(x.r);
    $("r-signed").textContent = `부호 있는 수로 ${num(x.sr)}`;
    for (const k of ["c", "v", "z", "n"]) {
      const on = x[k.toUpperCase()] === 1;
      $(`lamp-${k}`).classList.toggle("on", on);
      $(`lamp-${k}`).querySelector(".state").textContent = on ? "켜짐 (1)" : "꺼짐 (0)";
    }
    const parts = [];
    parts.push(`부호 없는 수로 ${a} + ${b} = ${x.sum}` + (x.C ? `, 8비트에는 ${x.r}만 남는다 → C 켜짐` : ` → 범위 안`));
    parts.push(`부호 있는 수로 ${num(x.sa)} + ${x.sb < 0 ? `(${num(x.sb)})` : num(x.sb)} = ${num(x.ss)}` + (x.V ? `, 8비트에는 ${num(x.sr)}${iga(x.sr)} 남는다 → V 켜짐` : ` → 범위 안`));
    $("note").textContent = parts.join(". ") + ".";
    document.querySelectorAll("[data-a]").forEach(btn => btn.setAttribute("aria-pressed", String(Number(btn.dataset.a) === a && Number(btn.dataset.b) === b)));
  }

  $("a").addEventListener("input", render);
  $("b").addEventListener("input", render);
  document.querySelectorAll("[data-a]").forEach(btn => btn.addEventListener("click", () => {
    $("a").value = btn.dataset.a;
    $("b").value = btn.dataset.b;
    render();
  }));
  render();
})();
</script>
</body>
</html>
