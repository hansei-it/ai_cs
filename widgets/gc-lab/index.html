<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GC 실험실</title>
<meta name="description" content="화살표를 눌러 참조를 끊은 뒤 ‘참조 카운팅’과 ‘마크 앤 스윕’을 각각 돌려, 어떤 객체가 치워지고 어떤 객체가 남는지 비교한다">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2329;
    --muted: #5f6670;
    --line: #9aa3af;
    --soft: #f3f5f8;
    --accent: #3f51b5;
    --accent-bg: #e8ebfa;
    --root: #237032;
    --root-bg: #e6f4ea;
    --freed: #c2410c;
    --freed-bg: #fdf0e3;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1e2129;
    --fg: #e2e4e9;
    --muted: #9aa0aa;
    --line: #6b7280;
    --soft: #262a33;
    --accent: #8c9eff;
    --accent-bg: #2b3156;
    --root: #69db7c;
    --root-bg: #1e3524;
    --freed: #ffa94d;
    --freed-bg: #3d2c18;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    padding: 14px 16px 16px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    word-break: keep-all;
  }
  .mono { font-family: "JetBrains Mono", Consolas, "D2Coding", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", monospace; }
  h1 { font-size: 16px; margin: 0 0 10px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 8px; }
  .row > .label { color: var(--muted); font-size: 14px; min-width: 3.5em; }
  .btn {
    font: inherit; font-size: 13px; color: var(--fg); background: var(--soft); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 9px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 700; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { display: block; width: 100%; max-width: 620px; height: auto; }
  .edge { stroke: var(--line); stroke-width: 2; fill: none; cursor: pointer; }
  .edge:hover { stroke: var(--accent); stroke-width: 3.5; }
  .edge.mark { stroke: var(--accent); stroke-width: 2.5; }
  .hit { stroke: transparent; stroke-width: 16; fill: none; cursor: pointer; }
  .node rect { fill: var(--soft); stroke: var(--line); stroke-width: 1.5; }
  .node.root rect { fill: var(--root-bg); stroke: var(--root); }
  .node.marked rect { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2.5; }
  .node.freed rect { fill: var(--freed-bg); stroke: var(--freed); stroke-dasharray: 4 3; }
  .node text { fill: var(--fg); font-size: 14px; font-weight: 700; text-anchor: middle; }
  .node .sub { font-size: 11px; font-weight: 400; fill: var(--muted); }
  .node.freed text { fill: var(--freed); }
  .head { fill: var(--line); }
  .head.mark { fill: var(--accent); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend span::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; border: 1.5px solid var(--line); background: var(--soft); }
  .legend .l-root::before { background: var(--root-bg); border-color: var(--root); }
  .legend .l-mark::before { background: var(--accent-bg); border-color: var(--accent); }
  .legend .l-freed::before { background: var(--freed-bg); border-color: var(--freed); border-style: dashed; }
  .note { margin: 10px 0 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--soft); font-size: 14px; min-height: 2.6em; }
  @media (max-width: 480px) {
    body { padding: 10px; font-size: 14px; }
  }
</style>
</head>
<body>
<h1>GC 실험실</h1>
<div class="row" role="group" aria-label="예제">
  <span class="label">예제</span>
  <button class="btn" data-preset="cycle">순환 참조</button>
  <button class="btn" data-preset="cache">캐시에 남은 객체</button>
</div>
<div class="row">
  <span class="label">GC</span>
  <button class="btn primary" id="rc">참조 카운팅</button>
  <button class="btn primary" id="ms">마크 앤 스윕</button>
  <button class="btn" id="step" disabled>표시 한 단계</button>
  <button class="btn" id="reset">처음으로</button>
</div>
<svg id="g" viewBox="0 0 620 300" role="img" aria-label="객체 그래프"></svg>
<div class="legend"><span class="l-root">루트 (스택 변수, static)</span><span class="l-mark">살아 있다고 표시됨</span><span class="l-freed">치워짐</span><span>화살표를 누르면 그 참조를 끊는다</span></div>
<p class="note" id="note" aria-live="polite"></p>

<script>
// ==== 계산 로직 (화면과 분리: tests에서 그대로 불러 검증한다) ====
const GcLogic = (() => {
  // 루트는 스택 변수나 static 필드처럼 프로그램이 지금 바로 쓸 수 있는 참조의 출발점이다.
  const PRESETS = {
    cycle: {
      nodes: [
        { id: "a", root: true, label: "a", sub: "지역 변수", x: 70, y: 60 },
        { id: "b", root: true, label: "b", sub: "지역 변수", x: 70, y: 200 },
        { id: "A", label: "A", x: 250, y: 60 }, { id: "B", label: "B", x: 430, y: 60 },
        { id: "C", label: "C", x: 250, y: 200 }, { id: "D", label: "D", x: 430, y: 200 },
        { id: "E", label: "E", x: 560, y: 130 },
      ],
      edges: [["a", "A"], ["A", "B"], ["b", "C"], ["C", "D"], ["D", "C"], ["E", "B"]],
      hint: "C와 D는 서로 가리킨다. 먼저 b → C 화살표를 눌러 끊은 뒤 두 GC를 각각 돌려 본다.",
    },
    cache: {
      nodes: [
        { id: "a", root: true, label: "a", sub: "지역 변수", x: 70, y: 60 },
        { id: "s", root: true, label: "Cache", sub: "static 목록", x: 70, y: 210 },
        { id: "R", label: "결과1", x: 300, y: 60 }, { id: "S", label: "결과2", x: 300, y: 210 },
        { id: "T", label: "결과3", x: 500, y: 210 },
      ],
      edges: [["a", "R"], ["s", "R"], ["s", "S"], ["s", "T"]],
      hint: "a → 결과1을 끊어도 Cache가 결과들을 가리키고 있다. GC를 돌려 본다.",
    },
  };

  const copy = p => ({ nodes: p.nodes.map(n => ({ ...n })), edges: p.edges.map(e => [...e]), freed: [] });

  // 참조 카운팅: 들어오는 참조가 0인 객체를 치우고, 그 객체가 가리키던 참조도 함께 사라진다. 순환은 0이 되지 않는다.
  function refcount(g) {
    const freed = new Set(g.freed);
    let edges = g.edges.filter(([f, t]) => !freed.has(f) && !freed.has(t));
    const order = [];
    for (;;) {
      const zero = g.nodes.find(n => !n.root && !freed.has(n.id) && !edges.some(([, t]) => t === n.id));
      if (!zero) break;
      freed.add(zero.id);
      order.push(zero.id);
      edges = edges.filter(([f]) => f !== zero.id);
    }
    const counts = Object.fromEntries(g.nodes.filter(n => !n.root && !freed.has(n.id)).map(n => [n.id, edges.filter(([, t]) => t === n.id).length]));
    return { freed: order, counts };
  }

  // 마크 앤 스윕: 루트에서 화살표를 따라 닿는 객체에 표시하고(마크), 표시가 없는 객체를 치운다(스윕)
  function markOrder(g) {
    const alive = g.nodes.filter(n => !g.freed.includes(n.id));
    const edges = g.edges.filter(([f, t]) => !g.freed.includes(f) && !g.freed.includes(t));
    const seen = new Set(alive.filter(n => n.root).map(n => n.id));
    const queue = [...seen], order = [];
    while (queue.length) {
      const cur = queue.shift();
      for (const [f, t] of edges)
        if (f === cur && !seen.has(t)) { seen.add(t); queue.push(t); order.push(t); }
    }
    return order;
  }
  function sweep(g, marked) {
    return g.nodes.filter(n => !n.root && !g.freed.includes(n.id) && !marked.includes(n.id)).map(n => n.id);
  }

  // 조사: 마지막 글자의 받침으로 고른다 (한글은 받침, 숫자 0·1·3·6·7·8과 L·M·N·R은 받침 있음)
  function batchim(word) {
    const ch = String(word).slice(-1), code = ch.charCodeAt(0);
    if (code >= 0xac00 && code <= 0xd7a3) return (code - 0xac00) % 28 !== 0;
    return "013678LMNRlmnr".includes(ch);
  }
  const eul = w => (batchim(w) ? "을" : "를");

  return { PRESETS, copy, refcount, markOrder, sweep, eul };
})();
// ==== 계산 로직 끝 ====

// ---- 강의 사이트 안에 들어갔을 때: 테마와 높이 맞추기 ----
(() => {
  const media = matchMedia("(prefers-color-scheme: dark)");
  let parentBody = null;
  try { if (window.parent !== window) parentBody = window.parent.document.body; } catch { parentBody = null; }
  const sync = () => {
    let dark = media.matches;
    const scheme = parentBody && parentBody.getAttribute("data-md-color-scheme");
    if (scheme) dark = scheme === "slate";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  };
  sync();
  media.addEventListener("change", sync);
  if (parentBody) new MutationObserver(sync).observe(parentBody, { attributes: true, attributeFilter: ["data-md-color-scheme"] });

  // 문서 전체가 아니라 내용(body) 높이로 맞춘다. 그래야 내용이 줄 때 iframe도 줄어든다.
  const fit = () => {
    try {
      if (window.frameElement) window.frameElement.style.height = `${Math.ceil(document.body.getBoundingClientRect().height)}px`;
    } catch { /* 다른 출처에서 열린 경우 */ }
  };
  new ResizeObserver(fit).observe(document.body);
})();

// ---- 화면 ----
(() => {
  const L = GcLogic;
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  let preset = "cycle", g = null, marked = [], marking = null, note = "";
  const label = id => g.nodes.find(n => n.id === id).label;

  function load(p) {
    preset = p;
    g = L.copy(L.PRESETS[p]);
    marked = []; marking = null;
    note = L.PRESETS[p].hint;
    document.querySelectorAll("[data-preset]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.preset === p)));
    render();
  }

  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.append(e); return e; };
  const W = 76, H = 44;
  function endpoint(from, to) {
    // to 상자의 테두리에서 멈추도록 선을 줄인다
    const dx = to.x - from.x, dy = to.y - from.y;
    const sx = Math.abs(dx) / (W / 2 + 4), sy = Math.abs(dy) / (H / 2 + 4);
    const s = Math.max(sx, sy) || 1;
    return [to.x - dx / s, to.y - dy / s];
  }

  function render() {
    const svg = $("g");
    svg.textContent = "";
    const defs = el("defs", {}, svg);
    for (const [id, cls] of [["h", "head"], ["hm", "head mark"]]) {
      const m = el("marker", { id, viewBox: "0 0 8 8", refX: 7, refY: 4, markerWidth: 7, markerHeight: 7, orient: "auto" }, defs);
      el("path", { d: "M0 0 L8 4 L0 8 z", class: cls }, m);
    }
    const pos = Object.fromEntries(g.nodes.map(n => [n.id, n]));
    const pair = new Set(g.edges.map(([f, t]) => `${f}>${t}`));
    g.edges.forEach(([f, t], i) => {
      if (g.freed.includes(f) || g.freed.includes(t)) return;
      const a = pos[f], b = pos[t];
      const back = pair.has(`${t}>${f}`);
      const [ex, ey] = endpoint(a, b), [sx, sy] = endpoint(b, a);
      // 서로 가리키면 두 선을 위아래로 벌린다
      const off = back ? (f < t ? -10 : 10) : 0;
      const nx = -(ey - sy), ny = ex - sx, len = Math.hypot(nx, ny) || 1;
      const ox = (nx / len) * off, oy = (ny / len) * off;
      const d = `M${sx + ox} ${sy + oy} L${ex + ox} ${ey + oy}`;
      const isMark = marked.includes(t) && (pos[f].root || marked.includes(f));
      el("path", { d, class: "edge" + (isMark ? " mark" : ""), "marker-end": `url(#${isMark ? "hm" : "h"})` }, svg);
      const hit = el("path", { d, class: "hit" }, svg);
      const title = el("title", {}, hit); title.textContent = `${pos[f].label} → ${pos[t].label} 참조 끊기`;
      hit.addEventListener("click", () => {
        g.edges.splice(i, 1);
        marked = []; marking = null;
        const code = pos[f].id === "s" ? ` 코드로 치면 목록에서 ${pos[t].label}${L.eul(pos[t].label)} 빼는 것(Cache.Items.Remove(…))이다.` : pos[f].root ? ` 코드로 치면 ${pos[f].label} = null; 이다.` : "";
        note = `${pos[f].label} → ${pos[t].label} 참조를 끊었다.` + code;
        render();
      });
    });
    for (const n of g.nodes) {
      const cls = "node" + (n.root ? " root" : "") + (marked.includes(n.id) ? " marked" : "") + (g.freed.includes(n.id) ? " freed" : "");
      const grp = el("g", { class: cls }, svg);
      el("rect", { x: n.x - W / 2, y: n.y - H / 2, width: W, height: H, rx: 8 }, grp);
      const t = el("text", { x: n.x, y: n.y + (n.sub ? -2 : 5) }, grp); t.textContent = n.label;
      if (n.sub) { const s = el("text", { x: n.x, y: n.y + 14, class: "sub" }, grp); s.textContent = n.sub; }
      if (g.freed.includes(n.id)) { const s = el("text", { x: n.x, y: n.y + H / 2 + 14, class: "sub" }, grp); s.textContent = "치워짐"; }
    }
    $("note").textContent = note;
    $("step").disabled = !marking;
  }

  $("rc").addEventListener("click", () => {
    marked = []; marking = null;
    const r = L.refcount(g);
    g.freed.push(...r.freed);
    const left = Object.entries(r.counts).filter(([, c]) => c > 0);
    const freedNames = r.freed.map(label).join(", ");
    note = (r.freed.length ? `참조 카운팅: 들어오는 참조가 0인 ${freedNames}${L.eul(freedNames)} 치웠다.` : "참조 카운팅: 들어오는 참조가 0인 객체가 없다.") +
      (left.length ? ` 남은 객체의 참조 수: ${left.map(([k, c]) => `${label(k)} ${c}`).join(", ")}.` : "") +
      (preset === "cycle" && !g.edges.some(([f, t]) => f === "b" && t === "C") && !g.freed.includes("C") ? " C와 D는 서로를 가리켜 1씩 남는다. 루트에서 닿지 않는데도 치우지 못한다(순환 참조)." : "");
    render();
  });
  $("ms").addEventListener("click", () => {
    marked = []; marking = L.markOrder(g);
    note = "마크: 루트에서 출발해 화살표를 따라가며 닿는 객체에 표시한다. ‘표시 한 단계’를 누른다.";
    render();
  });
  $("step").addEventListener("click", () => {
    if (!marking) return;
    if (marking.length) {
      const id = marking.shift();
      marked.push(id);
      note = `${label(id)}에 닿았다. 살아 있는 객체로 표시한다.` + (marking.length ? "" : " 더 닿는 객체가 없다. 한 번 더 누르면 스윕한다.");
    } else {
      const gone = L.sweep(g, marked);
      g.freed.push(...gone);
      const goneNames = gone.map(label).join(", ");
      note = gone.length ? `스윕: 표시가 없는 ${goneNames}${L.eul(goneNames)} 치웠다. 서로 가리키는 객체도 루트에서 닿지 않으면 치운다.` : "스윕: 표시가 없는 객체가 없다. 모두 루트에서 닿는다. GC는 도달할 수 있는 객체를 치우지 않는다.";
      marking = null;
    }
    render();
  });
  $("reset").addEventListener("click", () => load(preset));
  document.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => load(b.dataset.preset)));
  load("cycle");
})();
</script>
</body>
</html>
