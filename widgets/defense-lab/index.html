<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상담 AI의 방어를 겹겹이</title>
<meta name="description" content="&quot;프롬프트로 부탁만&quot;을 누르기 전에 다섯 사고의 결과를 먼저 적어 보고, 방어를 하나씩 켜고 끄며 막히는지, 줄어들기만 하는지, 그대로 일어나는지 본다">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2329;
    --muted: #5f6670;
    --line: #d9dde3;
    --soft: #f3f5f8;
    --accent: #3f51b5;
    --accent-bg: #e8ebfa;
    --read: #1971c2;
    --read-bg: #e7f1fb;
    --write: #c2410c;
    --write-bg: #fdf0e3;
    --good: #2b8a3e;
    --good-bg: #e6f4ea;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1e2129;
    --fg: #e2e4e9;
    --muted: #9aa0aa;
    --line: #3a3f4b;
    --soft: #262a33;
    --accent: #8c9eff;
    --accent-bg: #2b3156;
    --read: #74c0fc;
    --read-bg: #1d3247;
    --write: #ffa94d;
    --write-bg: #3d2a17;
    --good: #69db7c;
    --good-bg: #1f3326;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    padding: 14px 16px 16px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    word-break: keep-all;
  }
  .mono { font-family: "JetBrains Mono", Consolas, "D2Coding", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", monospace; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .lead { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 8px; }
  .row > .label { color: var(--muted); font-size: 14px; min-width: 4.5em; }
  .btn {
    font: inherit; font-size: 13px; color: var(--fg); background: var(--soft); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 9px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .btn.go { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=range] { accent-color: var(--accent); }
  .warn { color: var(--write); font-weight: 700; }
  .fine { color: var(--good); font-weight: 700; }
  .note { margin: 10px 0 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--soft); font-size: 14px; min-height: 2.6em; }
  .defs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .defs .btn { font-size: 13px; text-align: left; }
  .defs .btn .ref { color: var(--muted); font-weight: 400; }
  .defs .btn.soft { border-style: dashed; }
  .defs .btn[aria-pressed="true"] { background: var(--accent-bg); }
  .sum { font-size: 14px; margin: 0 0 8px; }
  .sum .cap { color: var(--muted); font-size: 13px; }
  .cases { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .case { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  .case h2 { font-size: 14px; margin: 0 0 4px; }
  .case .how { margin: 0 0 4px; }
  .case .way { color: var(--muted); margin: 0 0 6px; }
  .case .st { font-weight: 700; }
  .case.happens { border-color: var(--write); background: var(--write-bg); }
  .case.happens .st { color: var(--write); }
  .case.reduced { border-color: var(--write); border-style: dashed; }
  .case.reduced .st { color: var(--write); }
  .case.blocked .st { color: var(--good); }
  .case .fix { color: var(--muted); margin-top: 2px; }
  @media (max-width: 560px) { .cases { grid-template-columns: 1fr; } }
  @media (max-width: 480px) { body { padding: 10px; font-size: 14px; } }
</style>
</head>
<body>
<h1>상담 AI의 방어를 겹겹이</h1>
<p class="lead">쇼핑몰의 상담 AI(이 강의가 만든 예)에 생길 수 있는 사고 다섯 가지다. 모델은 문서 속 지시에 넘어가거나 시키지 않은 글을 낼 수 있다고 보고, 프로그램 쪽 방어와 프롬프트로 하는 부탁을 켜고 끄며 견준다.</p>
<div class="row" role="group" aria-label="방어 한꺼번에 고르기">
  <span class="label">한꺼번에</span>
  <button class="btn" data-preset="none">방어 없이</button>
  <button class="btn" data-preset="plea">프롬프트로 부탁만</button>
  <button class="btn" data-preset="all">겹겹이</button>
</div>
<div class="defs" id="defs" role="group" aria-label="방어"></div>
<div class="sum" id="sum"></div>
<div class="cases" id="cases"></div>
<p class="note" id="note" aria-live="polite"></p>

<script>
// ==== 계산 로직 (화면과 분리: tests에서 그대로 불러 검증한다) ====
const DefenseLogic = (() => {
  // 방어 일곱 가지. soft: 프롬프트로 하는 부탁(모델이 지킨다는 보장이 없어 줄이기만 한다)
  const DEFENSES = [
    { key: "tools", label: "상담 AI에는 조회 도구만 준다", ref: "75번" },
    { key: "approve", label: "환불은 사람이 승인한다", ref: "98번" },
    { key: "urls", label: "답의 주소는 허용 목록만 둔다", ref: "문제 1" },
    { key: "nosecret", label: "비밀값을 맥락에 넣지 않는다", ref: "76번" },
    { key: "authz", label: "도구는 손님의 권한으로 조회한다", ref: "75번" },
    { key: "escape", label: "답 속 HTML을 이스케이프한다", ref: "74번" },
    { key: "plea", label: "프롬프트에 하지 말라고 적는다", ref: "문제 2", soft: true },
  ];
  // 사고 다섯 가지: 어떻게 시작되고, 어느 길로 나가며, 무엇이 피해이고, 어느 방어가 그 길을 막는가
  const CASES = [
    { key: "refund", label: "손님 모르게 환불", how: "찾아 넣은 상품 후기에 지시처럼 쓰인 글이 있고, 모델이 그 글을 따른다.",
      way: "도구 호출: 환불", harm: "주문이 손님 모르게 환불된다", block: ["tools", "approve"] },
    { key: "image", label: "그림 주소로 대화가 나감", how: "찾아 넣은 웹 페이지의 글을 따라, 모델이 대화 내용을 붙인 그림 주소를 답에 쓴다.",
      way: "화면: 채팅 화면이 답의 Markdown 그림을 불러온다", harm: "그림을 불러오는 요청에 실려 대화 내용이 다른 서버로 간다", block: ["urls"] },
    { key: "secret", label: "API 키가 답에 나옴", how: "개발자가 배송 조회 API 키를 시스템 프롬프트에 적어 두었고, 손님이 설정을 캐묻는다.",
      way: "맥락에 든 비밀값: 시스템 프롬프트의 글이 답에 실린다", harm: "API 키가 답에 나온다", block: ["nosecret"] },
    { key: "other", label: "남의 주문이 보임", how: "손님이 남의 주문 번호를 대며 묻고, 모델이 그 번호로 조회 도구를 부른다.",
      way: "다른 손님의 데이터: 조회 도구가 찾아 온 남의 주문이 답에 실린다", harm: "다른 손님의 배송지와 주문이 보인다", block: ["authz"] },
    { key: "script", label: "답의 스크립트가 돎", how: "답을 꾸미려고 모델이 낸 HTML을 화면에 그대로 넣는데, 그 안에 스크립트가 섞인다.",
      way: "화면: 답의 HTML", harm: "손님의 화면에서 스크립트가 돈다", block: ["escape"] },
  ];
  const all = v => Object.fromEntries(DEFENSES.map(d => [d.key, v(d)]));
  const PRESETS = { none: all(() => false), plea: all(d => Boolean(d.soft)), all: all(() => true) };

  // 사고 하나의 결과. on: { 방어: true/false }
  // 그 길을 막는 방어가 하나라도 켜져 있으면 막힌다(by: 막은 방어들). 부탁만 있으면 줄어들 뿐 일어날 수 있다
  function outcome(c, on) {
    const by = c.block.filter(k => on[k]);
    if (by.length) return { state: "blocked", by };
    return { state: on.plea ? "reduced" : "happens", by: [] };
  }
  function summary(on) {
    const r = { blocked: [], reduced: [], happens: [] };
    for (const c of CASES) r[outcome(c, on).state].push(c.key);
    return r;
  }
  return { DEFENSES, CASES, PRESETS, outcome, summary };
})();
// ==== 계산 로직 끝 ====

// ---- 강의 사이트 안에 들어갔을 때: 테마와 높이 맞추기 ----
(() => {
  const media = matchMedia("(prefers-color-scheme: dark)");
  let parentBody = null;
  try { if (window.parent !== window) parentBody = window.parent.document.body; } catch { parentBody = null; }
  const sync = () => {
    let dark = media.matches;
    const scheme = parentBody && parentBody.getAttribute("data-md-color-scheme");
    if (scheme) dark = scheme === "slate";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  };
  sync();
  media.addEventListener("change", sync);
  if (parentBody) new MutationObserver(sync).observe(parentBody, { attributes: true, attributeFilter: ["data-md-color-scheme"] });

  // 문서 전체가 아니라 내용(body) 높이로 맞춘다. 그래야 내용이 줄 때 iframe도 줄어든다.
  const fit = () => {
    try {
      if (window.frameElement) window.frameElement.style.height = `${Math.ceil(document.body.getBoundingClientRect().height)}px`;
    } catch { /* 다른 출처에서 열린 경우 */ }
  };
  new ResizeObserver(fit).observe(document.body);
})();

// ---- 화면 ----
(() => {
  const L = DefenseLogic;
  const $ = id => document.getElementById(id);
  const label = k => L.DEFENSES.find(d => d.key === k).label;
  const caseLabel = k => L.CASES.find(c => c.key === k).label;
  let on = { ...L.PRESETS.none };
  const q = new URLSearchParams(location.search).get("preset");
  if (q && Object.hasOwn(L.PRESETS, q)) on = { ...L.PRESETS[q] };

  function render() {
    $("defs").innerHTML = L.DEFENSES.map(d => `<button class="btn${d.soft ? " soft" : ""}" data-d="${d.key}" aria-pressed="${on[d.key]}"${d.soft ? ' title="모델에게 하는 부탁이다. 지킨다는 보장이 없다"' : ""}>${d.label} <span class="ref">(${d.ref})</span></button>`).join("");
    $("cases").innerHTML = L.CASES.map(c => {
      const o = L.outcome(c, on);
      let st, fix = "";
      if (o.state === "blocked") st = `막혔다: ${o.by.map(label).join(", ")}${o.by.length > 1 ? ` (${o.by.length}겹)` : ""}`;
      else {
        st = o.state === "reduced" ? `줄어들 뿐 일어날 수 있다: ${c.harm}` : `일어난다: ${c.harm}`;
        fix = `<div class="fix">이 길을 막는 방어: ${c.block.map(label).join(", 또는 ")}</div>`;
      }
      return `<section class="case ${o.state}"><h2>${c.label}</h2><p class="how">${c.how}</p><p class="way">나가는 길: ${c.way}</p><div class="st">${st}</div>${fix}</section>`;
    }).join("");
    document.querySelectorAll("[data-d]").forEach(b => b.addEventListener("click", () => {
      on[b.dataset.d] = !on[b.dataset.d];
      render();
      document.querySelector(`[data-d="${b.dataset.d}"]`).focus();
    }));
    document.querySelectorAll("[data-preset]").forEach(b => b.setAttribute("aria-pressed",
      String(L.DEFENSES.every(d => L.PRESETS[b.dataset.preset][d.key] === on[d.key]))));

    const s = L.summary(on);
    $("sum").innerHTML = `<span class="fine">막혔다 ${s.blocked.length}</span> · <span class="warn">줄어들 뿐 ${s.reduced.length}</span> · <span class="warn">일어난다 ${s.happens.length}</span> <span class="cap">(사고 다섯 가지 가운데)</span>`;
    const open = [...s.happens, ...s.reduced];
    const hard = L.DEFENSES.filter(d => !d.soft && on[d.key]).length;
    let note;
    if (!open.length) {
      const refund = L.outcome(L.CASES[0], on).by.length;
      note = "다섯 사고가 모두 프로그램 쪽에서 막혔다. 모델이 문서 속 지시에 넘어가더라도 피해로 이어지지 않는다. "
        + (refund > 1 ? "환불은 두 겹으로 막혀, 한 겹을 빠뜨려도 막힌다." : "환불은 한 겹으로만 막혀 있다. 조회 도구만 주는 것과 사람의 승인을 겹쳐 두면 한 겹을 빠뜨려도 막힌다.");
    } else if (!hard && on.plea) note = "프롬프트에 하지 말라고 적으면 모델이 덜 따를 수는 있지만, 다섯 사고 모두 여전히 일어날 수 있다. 모델이 부탁을 지킨다는 보장이 없다(문제 2). 프로그램 쪽 방어를 켜 본다.";
    else if (!hard) note = "방어가 없으면 다섯 사고가 모두 일어난다. 모델이 지시처럼 쓰인 글에 넘어가거나 시키지 않은 글을 내면 그대로 피해가 된다. 방어를 하나씩 켜 본다.";
    else {
      note = `아직 막지 못한 사고: ${open.map(caseLabel).join(", ")}. 방어마다 막는 길이 다르다. 나가는 길마다 그 길의 방어를 둔다.`;
      if (on.escape && open.includes("image")) note += " 이스케이프는 HTML 태그를 글자로 바꾼다. Markdown의 그림 문법은 HTML 태그가 아니라서, 이스케이프한 뒤에도 화면이 그대로 그림으로 그린다.";
    }
    $("note").textContent = note;
  }
  document.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => {
    on = { ...L.PRESETS[b.dataset.preset] };
    render();
  }));
  render();
})();
</script>
</body>
</html>
