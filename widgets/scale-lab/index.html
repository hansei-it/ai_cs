<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서버를 늘리면 얼마나 빨라지나</title>
<meta name="description" content="서버 수, 서버마다 동시에 처리하는 요청 수, DB가 동시에 처리하는 질의 수를 골라, 1초에 처리하는 주문 수와 막히는 곳(병목), 손님이 기다리는 시간을 본다">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2329;
    --muted: #5f6670;
    --line: #d9dde3;
    --soft: #f3f5f8;
    --accent: #3f51b5;
    --accent-bg: #e8ebfa;
    --read: #1971c2;
    --read-bg: #e7f1fb;
    --write: #c2410c;
    --write-bg: #fdf0e3;
    --good: #2b8a3e;
    --good-bg: #e6f4ea;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1e2129;
    --fg: #e2e4e9;
    --muted: #9aa0aa;
    --line: #3a3f4b;
    --soft: #262a33;
    --accent: #8c9eff;
    --accent-bg: #2b3156;
    --read: #74c0fc;
    --read-bg: #1d3247;
    --write: #ffa94d;
    --write-bg: #3d2a17;
    --good: #69db7c;
    --good-bg: #1f3326;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    padding: 14px 16px 16px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    word-break: keep-all;
  }
  .mono { font-family: "JetBrains Mono", Consolas, "D2Coding", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", monospace; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .lead { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 8px; }
  .row > .label { color: var(--muted); font-size: 14px; min-width: 4.5em; }
  .btn {
    font: inherit; font-size: 13px; color: var(--fg); background: var(--soft); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 9px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .btn.go { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=range] { accent-color: var(--accent); }
  .warn { color: var(--write); font-weight: 700; }
  .fine { color: var(--good); font-weight: 700; }
  .note { margin: 10px 0 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--soft); font-size: 14px; min-height: 2.6em; }
  .caps { display: grid; gap: 6px; margin: 6px 0 4px; }
  .cap { display: grid; grid-template-columns: 9.5em 1fr 6.5em; align-items: center; gap: 8px; font-size: 13px; }
  .cap .bar { height: 18px; background: var(--soft); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .cap .fill { height: 100%; background: var(--read-bg); border-right: 2px solid var(--read); }
  .cap.min .fill { background: var(--write-bg); border-right-color: var(--write); }
  .cap.min .name, .cap.min .val { color: var(--write); font-weight: 700; }
  .cap .val { text-align: right; white-space: nowrap; }
  .result { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 8px; font-size: 14px; }
  .result b { font-size: 20px; }
  .measured { font-size: 13px; color: var(--muted); margin-top: 2px; }
  @media (max-width: 480px) { body { padding: 10px; font-size: 14px; } .cap { grid-template-columns: 7.5em 1fr 5.5em; } }
</style>
</head>
<body>
<h1>서버를 늘리면 얼마나 빨라지나</h1>
<p class="lead">주문 하나를 처리하는 데 DB의 답을 50ms 기다린다. DB는 정해진 수까지만 질의를 동시에 처리한다. 손님 64명이 쉬지 않고 주문을 보낸다. 처리량은 서버 쪽, DB 쪽, 손님 수 가운데 가장 작은 쪽에서 정해진다. 이 PC에서 잰 조합을 고르면 잰 값도 함께 보인다.</p>
<div class="row" role="group" aria-label="서버 수">
  <span class="label">서버</span>
  <button class="btn" data-n="1">1대</button>
  <button class="btn" data-n="2">2대</button>
  <button class="btn" data-n="4">4대</button>
  <button class="btn" data-n="8">8대</button>
</div>
<div class="row" role="group" aria-label="서버마다 동시에 처리하는 요청 수">
  <span class="label">동시 처리</span>
  <button class="btn" data-k="1">1개</button>
  <button class="btn" data-k="2">2개</button>
  <button class="btn" data-k="4">4개</button>
  <button class="btn" data-k="8">8개</button>
  <button class="btn" data-k="16">16개</button>
</div>
<div class="row" role="group" aria-label="DB가 동시에 처리하는 질의 수">
  <span class="label">DB 동시 처리</span>
  <button class="btn" data-c="10">10개</button>
  <button class="btn" data-c="100">100개</button>
</div>

<div class="caps" id="caps"></div>
<div class="result" id="result"></div>
<div class="measured" id="measured"></div>
<p class="note" id="note" aria-live="polite"></p>

<script>
// ==== 계산 로직 (화면과 분리: tests에서 그대로 불러 검증한다) ====
const ScaleLogic = (() => {
  // 이 PC에서 65번 측정 프로그램으로 잰 값으로 맞춘 모형
  // 주문 하나: 서버에서 52ms(DB를 기다리는 50ms + 요청을 주고받는 일), DB는 질의 하나에 51ms 걸리고 c개까지 동시에 처리한다
  const APP_S = 0.052, DB_S = 0.051, CLIENTS = 64;
  // 이 PC에서 잰 처리량(요청/초, 5번 잰 범위): "서버 수,동시 처리,DB 동시 처리" → [최소, 최대]
  const MEASURED = {
    "1,1,100": [19.1, 19.2], "1,2,100": [38.4, 38.6], "1,4,100": [76.6, 77.8], "1,8,100": [153.5, 155.4], "1,16,100": [305.9, 313.6],
    "2,4,100": [154.6, 156.8],
    "1,4,10": [77.0, 78.1], "2,4,10": [153.2, 156.7], "4,4,10": [195.3, 196.0], "8,4,10": [195.5, 195.9],
  };
  // 처리량은 세 한계 가운데 가장 작은 것이다. 손님은 늘 64명이 기다리므로 한 사람이 기다리는 시간은 64 ÷ 처리량(리틀의 법칙)
  // 한계가 같으면 손님 → DB → 서버 차례로 병목이라 부른다(서버를 늘려도 더 빨라지지 않는 쪽을 먼저)
  function run(n, k, c) {
    const caps = [
      { key: "server", name: "서버 쪽", per: n * k / APP_S, how: `${n}대 × ${k}개 ÷ 0.052초` },
      { key: "db", name: "DB 쪽", per: c / DB_S, how: `동시 ${c}개 ÷ 0.051초` },
      { key: "clients", name: "손님 64명", per: CLIENTS / APP_S, how: "64명 ÷ 0.052초" },
    ];
    const min = [caps[2], caps[1], caps[0]].reduce((a, b) => (b.per < a.per - 1e-9 ? b : a));
    const x = min.per;
    return { caps, bottleneck: min.key, throughput: Math.round(x * 10) / 10, wait: Math.round(CLIENTS / x * 1000), measured: MEASURED[`${n},${k},${c}`] ?? null };
  }
  return { APP_S, DB_S, CLIENTS, MEASURED, run };
})();
// ==== 계산 로직 끝 ====

// ---- 강의 사이트 안에 들어갔을 때: 테마와 높이 맞추기 ----
(() => {
  const media = matchMedia("(prefers-color-scheme: dark)");
  let parentBody = null;
  try { if (window.parent !== window) parentBody = window.parent.document.body; } catch { parentBody = null; }
  const sync = () => {
    let dark = media.matches;
    const scheme = parentBody && parentBody.getAttribute("data-md-color-scheme");
    if (scheme) dark = scheme === "slate";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  };
  sync();
  media.addEventListener("change", sync);
  if (parentBody) new MutationObserver(sync).observe(parentBody, { attributes: true, attributeFilter: ["data-md-color-scheme"] });

  // 문서 전체가 아니라 내용(body) 높이로 맞춘다. 그래야 내용이 줄 때 iframe도 줄어든다.
  const fit = () => {
    try {
      if (window.frameElement) window.frameElement.style.height = `${Math.ceil(document.body.getBoundingClientRect().height)}px`;
    } catch { /* 다른 출처에서 열린 경우 */ }
  };
  new ResizeObserver(fit).observe(document.body);
})();

// ---- 화면 ----
(() => {
  const L = ScaleLogic;
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  let n = Number(q.get("n")) || 1, k = Number(q.get("k")) || 4, c = Number(q.get("c")) || 100;   // 처음에는 DB가 넉넉하게(문제 1의 답을 먼저 보이지 않게)
  const fmt = v => (v >= 100 ? Math.round(v) : Math.round(v * 10) / 10).toLocaleString("ko-KR");
  function render() {
    const r = L.run(n, k, c);
    const top = Math.max(...r.caps.map(x => x.per));
    $("caps").innerHTML = r.caps.map(x => `<div class="cap ${x.key === r.bottleneck ? "min" : ""}"><span class="name">${x.name}<br><span class="mono" style="font-size:11px;color:var(--muted);font-weight:400">${x.how}</span></span>`
      + `<div class="bar"><div class="fill" style="width:${(x.per / top * 100).toFixed(1)}%"></div></div><span class="val mono">${fmt(x.per)}/초</span></div>`).join("");
    $("result").innerHTML = `<span>처리량 <b class="mono">${fmt(r.throughput)}</b> 요청/초</span><span>손님 한 명이 기다리는 시간 <b class="mono">${r.wait.toLocaleString("ko-KR")}</b> ms</span>`;
    $("measured").textContent = r.measured ? `이 PC에서 잰 값: ${r.measured[0].toFixed(1)}~${r.measured[1].toFixed(1)} 요청/초` : "이 조합은 재지 않았다(모형으로 계산한 값).";
    const why = {
      server: "서버 쪽이 가장 작다. 서버를 늘리거나 서버마다 동시에 처리하는 수를 늘리면 처리량이 는다.",
      db: "DB 쪽이 가장 작다. 서버를 더 늘려도 처리량은 그대로이고, 줄이 DB 앞으로 옮겨 갈 뿐이다. DB가 동시에 더 처리하게 키우거나 DB에 묻는 일을 줄여야(캐시, 68번) 는다.",
      clients: "손님 쪽이 가장 작다. 손님 64명이 모두 바로 처리되고 있어, 서버를 늘려도 더 할 일이 없다.",
    }[r.bottleneck];
    $("note").textContent = why;
    document.querySelectorAll("[data-n]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.n) === n)));
    document.querySelectorAll("[data-k]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.k) === k)));
    document.querySelectorAll("[data-c]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.c) === c)));
  }
  document.querySelectorAll("[data-n]").forEach(b => b.addEventListener("click", () => { n = Number(b.dataset.n); render(); }));
  document.querySelectorAll("[data-k]").forEach(b => b.addEventListener("click", () => { k = Number(b.dataset.k); render(); }));
  document.querySelectorAll("[data-c]").forEach(b => b.addEventListener("click", () => { c = Number(b.dataset.c); render(); }));
  render();
})();
</script>
</body>
</html>
