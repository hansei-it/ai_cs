<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이벤트 루프 한 단계씩 보기</title>
<meta name="description" content="코드를 골라 '한 단계'를 누르며, 콜 스택에서 무엇이 돌고 마이크로태스크 큐와 태스크 큐에 무엇이 줄을 서는지, 출력이 어떤 차례로 나오는지 본다">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2329;
    --muted: #5f6670;
    --line: #d9dde3;
    --soft: #f3f5f8;
    --accent: #3f51b5;
    --accent-bg: #e8ebfa;
    --read: #1971c2;
    --read-bg: #e7f1fb;
    --write: #c2410c;
    --write-bg: #fdf0e3;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1e2129;
    --fg: #e2e4e9;
    --muted: #9aa0aa;
    --line: #3a3f4b;
    --soft: #262a33;
    --accent: #8c9eff;
    --accent-bg: #2b3156;
    --read: #74c0fc;
    --read-bg: #1d3247;
    --write: #ffa94d;
    --write-bg: #3d2a17;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    padding: 14px 16px 16px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    word-break: keep-all;
  }
  .mono { font-family: "JetBrains Mono", Consolas, "D2Coding", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", monospace; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .lead { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 8px; }
  .row > .label { color: var(--muted); font-size: 14px; min-width: 3.5em; }
  .btn {
    font: inherit; font-size: 13px; color: var(--fg); background: var(--soft); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 9px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .btn.go { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 10px; }
  .code { margin: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); padding: 6px 0; font-size: 12.5px; overflow-x: auto; }
  .code div { padding: 0 8px; white-space: pre; }
  .code div .n { display: inline-block; width: 1.6em; color: var(--muted); }
  .code div.now { background: var(--accent-bg); outline: 1px solid var(--accent); }
  .boxes { display: grid; gap: 6px; align-content: start; }
  .box { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; min-height: 2.2em; }
  .box h2 { font-size: 12.5px; margin: 0 0 3px; }
  .box.stack h2 { color: var(--accent); }
  .box.micro h2 { color: var(--read); }
  .box.task h2 { color: var(--write); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; min-height: 1.4em; }
  .chip { font-size: 12px; border-radius: 4px; padding: 0 6px; border: 1px solid var(--line); background: var(--soft); }
  .stack .chips { flex-direction: column-reverse; }
  .stack .chip { border-color: var(--accent); background: var(--accent-bg); }
  .micro .chip { border-color: var(--read); background: var(--read-bg); }
  .task .chip { border-color: var(--write); background: var(--write-bg); }
  .empty { color: var(--muted); font-size: 12px; }
  .out { font-size: 12.5px; }
  .out .last { color: var(--accent); font-weight: 700; }
  .note { margin: 10px 0 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--soft); font-size: 14px; min-height: 2.6em; }
  .count { color: var(--muted); font-size: 13px; }
  @media (max-width: 560px) { .main { grid-template-columns: 1fr; } }
  @media (max-width: 480px) { body { padding: 10px; font-size: 14px; } .code { font-size: 11.5px; } }
</style>
</head>
<body>
<h1>이벤트 루프 한 단계씩 보기</h1>
<p class="lead">코드를 고르고 "한 단계"를 누른다. 0ms 타이머는 곧바로 끝나 콜백이 태스크 큐에 선다고 본다. 출력 차례는 이 PC의 Node.js와 Chrome에서 실제로 실행한 결과와 같다.</p>
<div class="row" role="group" aria-label="코드">
  <span class="label">코드</span>
  <button class="btn" data-preset="basic">동기, then, setTimeout</button>
  <button class="btn" data-preset="chain">then 잇기</button>
  <button class="btn" data-preset="await">await</button>
  <button class="btn" data-preset="timers">타이머 안의 then</button>
</div>
<div class="row">
  <button class="btn go" id="next">한 단계</button>
  <button class="btn" id="all">끝까지</button>
  <button class="btn" id="reset">처음으로</button>
  <span class="count" id="count"></span>
</div>
<div class="main">
  <div class="code mono" id="code"></div>
  <div class="boxes">
    <div class="box stack"><h2>콜 스택 (위가 지금 도는 것)</h2><div class="chips" id="stack"></div></div>
    <div class="box micro"><h2>마이크로태스크 큐 (왼쪽이 먼저)</h2><div class="chips" id="micro"></div></div>
    <div class="box task"><h2>태스크 큐 (왼쪽이 먼저)</h2><div class="chips" id="task"></div></div>
    <div class="box"><h2>출력</h2><div class="out mono" id="out"></div></div>
  </div>
</div>
<p class="note" id="note" aria-live="polite"></p>

<script>
// ==== 계산 로직 (화면과 분리: tests에서 그대로 불러 검증한다) ====
const EventLoopLogic = (() => {
  // 코드마다 줄과, 그 줄이 하는 일(log: 찍기, timeout: 타이머, then: 끝난 Promise의 then, note: 설명만, call: async 함수 부르기)
  const PRESETS = {
    basic: {
      code: ['console.log("A");', 'setTimeout(() => console.log("B"), 0);', 'Promise.resolve().then(() => console.log("C"));', 'console.log("D");'],
      main: [
        { t: "log", line: 1, text: "A" },
        { t: "timeout", line: 2, label: "타이머 콜백(B)", body: [{ t: "log", line: 2, text: "B" }] },
        { t: "then", line: 3, label: "then 콜백(C)", body: [{ t: "log", line: 3, text: "C" }] },
        { t: "log", line: 4, text: "D" },
      ],
    },
    chain: {
      code: ['setTimeout(() => console.log("타이머"), 0);', "Promise.resolve()", '  .then(() => console.log("then 1"))', '  .then(() => console.log("then 2"));', 'console.log("동기");'],
      main: [
        { t: "timeout", line: 1, label: "타이머 콜백", body: [{ t: "log", line: 1, text: "타이머" }] },
        { t: "then", line: 3, label: "then 1 콜백", body: [{ t: "log", line: 3, text: "then 1" }],
          next: { line: 4, label: "then 2 콜백", body: [{ t: "log", line: 4, text: "then 2" }] } },
        { t: "note", line: 4, note: "then 2는 아직 줄을 서지 않는다. then 1이 끝나야 그 결과를 받아 줄을 선다." },
        { t: "log", line: 5, text: "동기" },
      ],
    },
    await: {
      code: ["async function f() {", '  console.log("f 시작");', "  await null;", '  console.log("f 끝");', "}", "f();", 'console.log("밖");'],
      fns: { f: { pre: [{ t: "log", line: 2, text: "f 시작" }], awaitLine: 3, post: [{ t: "log", line: 4, text: "f 끝" }] } },
      main: [{ t: "call", line: 6, fn: "f" }, { t: "log", line: 7, text: "밖" }],
    },
    timers: {
      code: ["setTimeout(() => {", '  console.log("타이머 1");', "  Promise.resolve().then(() =>", '    console.log("타이머 1의 then"));', "}, 0);", 'setTimeout(() => console.log("타이머 2"), 0);'],
      main: [
        { t: "timeout", line: 1, label: "타이머 1 콜백", body: [
          { t: "log", line: 2, text: "타이머 1" },
          { t: "then", line: 3, label: "then 콜백", body: [{ t: "log", line: 4, text: "타이머 1의 then" }] },
        ] },
        { t: "timeout", line: 6, label: "타이머 2 콜백", body: [{ t: "log", line: 6, text: "타이머 2" }] },
      ],
    },
  };
  // 한 단계마다 {line, note, stack, micro, task, out}을 남긴다
  function run(name) {
    const p = PRESETS[name];
    const steps = [], out = [], micro = [], tasks = [], stack = [];
    const snap = (line, note, kind = "") => steps.push({ line, note, kind, stack: [...stack], micro: micro.map(m => m.label), task: tasks.map(t => t.label), out: [...out] });
    const exec = body => {
      for (const s of body) {
        if (s.t === "log") { out.push(s.text); snap(s.line, `console.log가 "${s.text}"를 찍는다.`); }
        else if (s.t === "timeout") { tasks.push({ label: s.label, body: s.body, at: s.line }); snap(s.line, "setTimeout: 타이머를 맡긴다. 0ms라 곧 끝나고, 콜백이 태스크 큐 뒤에 선다."); }
        else if (s.t === "then") { micro.push({ label: s.label, body: s.body, at: s.line, next: s.next }); snap(s.line, "Promise가 이미 끝나 있어서, then 콜백이 바로 마이크로태스크 큐 뒤에 선다."); }
        else if (s.t === "note") snap(s.line, s.note);
        else if (s.t === "call") {
          const f = p.fns[s.fn];
          stack.push(`${s.fn}()`);
          snap(s.line, `${s.fn}()를 부른다. 콜 스택에 쌓이고, 함수 안을 실행한다.`);
          exec(f.pre);
          micro.push({ label: `${s.fn}()의 await 다음`, body: f.post, at: f.post[0].line, frame: `${s.fn}() (이어서)` });
          stack.pop();
          snap(f.awaitLine, `await: ${s.fn}()를 여기서 멈추고 콜 스택에서 내린다. 나머지는 마이크로태스크로 미루고, 부른 곳으로 돌아간다.`);
        }
      }
    };
    stack.push("전체 코드");
    snap(null, "전체 코드가 콜 스택에서 돌기 시작한다. \"한 단계\"를 누른다.", "start");
    exec(p.main);
    stack.pop();
    snap(null, "동기 코드가 끝나 콜 스택이 비었다. 이제 이벤트 루프가 큐를 본다.", "empty");
    while (micro.length || tasks.length) {
      if (micro.length) {
        const m = micro.shift();
        stack.push(m.frame || m.label);
        snap(m.at, "콜 스택이 비어서 마이크로태스크를 꺼낸다. 마이크로태스크 큐가 빌 때까지 계속 꺼낸다.", "micro");
        exec(m.body);
        stack.pop();
        if (m.next) { micro.push({ label: m.next.label, body: m.next.body, at: m.next.line }); snap(m.next.line, "앞의 then이 끝나서 다음 then 콜백이 마이크로태스크 큐 뒤에 선다."); }
        continue;
      }
      const tk = tasks.shift();
      stack.push(tk.label);
      snap(tk.at, "마이크로태스크 큐가 비었다. 태스크 큐에서 하나만 꺼낸다.", "task");
      exec(tk.body);
      stack.pop();
    }
    snap(null, "콜 스택과 두 큐가 모두 비었다. 끝.", "end");
    return steps;
  }
  return { PRESETS, run };
})();
// ==== 계산 로직 끝 ====

// ---- 강의 사이트 안에 들어갔을 때: 테마와 높이 맞추기 ----
(() => {
  const media = matchMedia("(prefers-color-scheme: dark)");
  let parentBody = null;
  try { if (window.parent !== window) parentBody = window.parent.document.body; } catch { parentBody = null; }
  const sync = () => {
    let dark = media.matches;
    const scheme = parentBody && parentBody.getAttribute("data-md-color-scheme");
    if (scheme) dark = scheme === "slate";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  };
  sync();
  media.addEventListener("change", sync);
  if (parentBody) new MutationObserver(sync).observe(parentBody, { attributes: true, attributeFilter: ["data-md-color-scheme"] });

  // 문서 전체가 아니라 내용(body) 높이로 맞춘다. 그래야 내용이 줄 때 iframe도 줄어든다.
  const fit = () => {
    try {
      if (window.frameElement) window.frameElement.style.height = `${Math.ceil(document.body.getBoundingClientRect().height)}px`;
    } catch { /* 다른 출처에서 열린 경우 */ }
  };
  new ResizeObserver(fit).observe(document.body);
})();

// ---- 화면 ----
(() => {
  const L = EventLoopLogic;
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let preset = "basic", steps = L.run(preset), i = 0;
  const chips = xs => xs.length ? xs.map(x => `<span class="chip">${esc(x)}</span>`).join("") : `<span class="empty">비었다</span>`;
  function render() {
    const s = steps[i], code = L.PRESETS[preset].code;
    $("code").innerHTML = code.map((c, k) => `<div class="${s.line === k + 1 ? "now" : ""}"><span class="n">${k + 1}</span>${esc(c)}</div>`).join("");
    $("stack").innerHTML = chips(s.stack);
    $("micro").innerHTML = chips(s.micro);
    $("task").innerHTML = chips(s.task);
    $("out").innerHTML = s.out.length ? s.out.map((o, k) => `<div class="${k === s.out.length - 1 && i > 0 && steps[i - 1].out.length < s.out.length ? "last" : ""}">${esc(o)}</div>`).join("") : `<span class="empty">아직 없다</span>`;
    $("note").textContent = s.note;
    $("count").textContent = `단계 ${i + 1} / ${steps.length}`;
    $("next").disabled = $("all").disabled = i === steps.length - 1;
    document.querySelectorAll("[data-preset]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.preset === preset)));
  }
  document.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => { preset = b.dataset.preset; steps = L.run(preset); i = 0; render(); }));
  $("next").addEventListener("click", () => { i = Math.min(i + 1, steps.length - 1); render(); });
  $("all").addEventListener("click", () => { i = steps.length - 1; render(); });
  $("reset").addEventListener("click", () => { i = 0; render(); });
  const q = new URLSearchParams(location.search).get("preset");
  if (q && L.PRESETS[q]) { preset = q; steps = L.run(preset); }
  render();
})();
</script>
</body>
</html>
